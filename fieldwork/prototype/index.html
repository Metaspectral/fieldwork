function postById(id){return [...state.community.posts,...COMMUNITY_POSTS].find(p=>p.id===id)}
function fieldArea(name){return ({'North field':4,'River field':6,'Home field':2})[name]||12}
function allTrials(){return [{...state.trial,id:'current'},...state.community.trials]}
function trialById(id='current'){return id==='current'?state.trial:state.community.trials.find(t=>t.id===id)}
function updateTrial(id,changes){const t=trialById(id);if(t)Object.assign(t,changes)}
function accordion(title,body,open=false){return `<details class="app-accordion" ${open?'open':''}><summary>${esc(title)}${icon('down')}</summary><div class="accordion-body">${body}</div></details>`}
function smallTitle(title,button=''){return `<div class="section-head between"><h2>${title}</h2>${button}</div>`}
function plotArt(kind='mulch',uid=''){const p=String(kind+uid).replace(/[^a-z0-9]/gi,'');const isSeed=kind==='seed',isTiming=kind==='timing',color=isSeed?'#c5aa72':isTiming?'#b4b69e':'#baa581';return `<svg viewBox="0 0 650 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrative paired trial beds, not actual satellite imagery"><defs><pattern id="r${p}" width="13" height="13" patternUnits="userSpaceOnUse"><path d="M4 0v13" stroke="#fffdf2" stroke-width="2" opacity=".25"/></pattern><pattern id="m${p}" width="17" height="18" patternUnits="userSpaceOnUse"><path d="m2 4 4 2m5 6 3-1m-5-8 3 3m-9 6 3 2" stroke="#e7ce9f" opacity=".55" stroke-width="2"/></pattern></defs><rect width="650" height="220" fill="#e5dfcf"/><path d="M0 177 650 150M195 0l75 220" stroke="#f4efdf" stroke-width="11"/><path d="M20 0c30 40-10 60 16 100s-6 65 24 120" fill="none" stroke="#c5cdbb" stroke-width="35" opacity=".65"/><g transform="translate(100 -25) rotate(-11 240 120)"><rect x="0" y="0" width="420" height="285" fill="${color}" rx="4"/><rect x="0" y="0" width="420" height="285" fill="url(#r${p})"/><g fill="#f1e8d0" stroke="#fffaf0" stroke-width="3"><rect x="34" y="43" width="56" height="168" rx="3"/><rect x="107" y="43" width="56" height="168" rx="3"/><rect x="209" y="43" width="56" height="168" rx="3"/><rect x="282" y="43" width="56" height="168" rx="3"/></g><g fill="${isSeed?'#ac8a49':'#8e7456'}"><rect x="39" y="48" width="46" height="158"/><rect x="112" y="48" width="46" height="158"/><rect x="214" y="48" width="46" height="158"/><rect x="287" y="48" width="46" height="158"/></g><g fill="url(#m${p})"><rect x="112" y="48" width="46" height="158"/><rect x="287" y="48" width="46" height="158"/></g><rect x="107" y="43" width="56" height="168" rx="3" fill="none" stroke="#a34d31" stroke-width="2"/><rect x="282" y="43" width="56" height="168" rx="3" fill="none" stroke="#a34d31" stroke-width="2"/></g></svg>`}
function landscapeArt(){return `<svg viewBox="0 0 780 170" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated farm landscape"><rect width="780" height="170" fill="#e6dfce"/><path d="M0 80C130 10 240 70 360 40s280-20 420 45v85H0Z" fill="#c2c2ac"/><path d="M0 125C140 40 270 130 410 80s220-4 370 21v69H0Z" fill="#bbae87"/><path d="M0 150c180-68 280-7 440-22s230-12 340 26v16H0Z" fill="#a38b65"/><g fill="none" stroke="#efdfbd" opacity=".6"><path d="M0 158c170-72 300-15 440-22s230-12 340 26M0 165c180-67 290-14 440-21s230-10 340 27M25 170c180-58 290-11 440-17s210-4 315 28"/></g><path d="M610 75v-26l30-20 30 20v26" fill="#ebdfca"/><path d="m605 49 35-26 35 26" fill="none" stroke="#8b5f43" stroke-width="5"/><rect x="630" y="54" width="19" height="22" fill="#8a7b62"/><circle cx="130" cy="35" r="16" fill="#f8edca"/></svg>`}
function productArt(){return `<svg viewBox="0 0 650 200" role="img" aria-label="Illustrative soil-temperature probe product concept"><rect width="650" height="200" fill="#e6e8e2"/><ellipse cx="343" cy="162" rx="118" ry="12" fill="#c4c9bf" opacity=".45"/><g transform="translate(307 15) rotate(23 20 80)"><rect x="14" y="78" width="7" height="101" rx="3" fill="#959f9d"/><path d="m14 176 3.5 11 3.5-11" fill="#808b89"/><rect width="37" height="102" rx="13" fill="#3d4d48"/><rect x="7" y="20" width="23" height="30" rx="4" fill="#bdcdb5"/><text x="18.5" y="38" text-anchor="middle" font-size="9" font-family="monospace" fill="#34463b">12.4°</text><circle cx="18.5" cy="66" r="7" fill="#a0ae98"/><path d="M15 66h7m-3.5-3.5v7" stroke="#4b5e51"/></g><g fill="#58645b" font-family="Arial,sans-serif"><text x="45" y="72" font-size="28" letter-spacing="-1">soilpin.</text><text x="46" y="94" font-size="11">One reading. Your notebook.</text><text x="46" y="163" font-size="9">FICTIONAL PRODUCT CONCEPT</text></g></svg>`}
function postVisual(p,compact=false){return `<div class="post-visual" ${compact?'style="height:135px"':''}>${plotArt(p.visual||'timing',p.id)}<div class="plot-legend"><span><i></i>Usual practice</span><span><i></i>${p.visual==='seed'?'Alternative':p.visual==='timing'?'Earlier sowing':'Leaf mulch'}</span></div><span class="visual-stamp">Illustration · demo trial</span></div>`}
function nav(){const current=page==='profile'?(profileId==='me'?'farm':'community'):page;$('#side-nav').innerHTML=navItems.map(([id,ic,label])=>`<button data-action="nav" data-page="${id}" class="${current===id?'active':''}" ${current===id?'aria-current="page"':''}>${icon(ic)}${label}${id==='plugins'?`<span class="nav-badge">${activeCount()}</span>`:''}</button>`).join('');$('#mobile-nav').innerHTML=navItems.map(([id,ic,label])=>`<button data-action="nav" data-page="${id}" class="${current===id?'active':''}" ${current===id?'aria-current="page"':''}><span class="nav-icon-wrap">${icon(ic)}</span><span>${label}</span></button>`).join('');$('#breadcrumb').textContent=page==='profile'?'Profile':(navItems.find(x=>x[0]===page)?.[2]||'Today');$('#active-count').textContent=`${activeCount()} plug-ins`;$('#review-dot').classList.toggle('hide',!state.proposals.length);$('#composer-wrap').classList.toggle('hide',page!=='assistant');document.documentElement.dataset.theme=state.theme;if($('#farm-name'))$('#farm-name').textContent=me().farm;if($('#side-farm-name'))$('#side-farm-name').textContent=me().farm;const pa=$('#top-profile');if(pa)pa.innerHTML=avatar(me());}
function render(){ensureSocial();nav();const main=$('#main');if(page==='assistant')main.innerHTML=assistantPage();else if(page==='plugins')main.innerHTML=pluginsPage();else if(page==='trials')main.innerHTML=trialsPage();else if(page==='community')main.innerHTML=communityPage();else if(page==='profile')main.innerHTML=profilePage();else main.innerHTML=farmPage();hydrate(main)}
function assistantPage(){if(state.messages.length)return `<div class="assistant-layout"><section class="assistant-main"><div class="conversation-heading"><div><div class="eyebrow">${esc(me().farm)} · assistant</div><h2 style="margin-top:7px">Let’s work through it.</h2></div><button class="icon-btn" data-action="new-chat" aria-label="New conversation">${icon('edit')}</button></div><div id="messages">${state.messages.map(messageHTML).join('')}</div></section>${rail()}</div>`;const t=state.trial;return `<div class="home-layout v2"><section class="home-main"><div class="compact-heading"><div><div class="home-date">Saturday, 14 November · demo</div><h1 class="home-title">Today at ${esc(me().farm)}.</h1></div><button class="icon-btn" data-action="preferences" aria-label="Workspace preferences">${icon('settings')}</button></div><article class="trial-hero"><div class="trial-hero-top"><div class="between"><span class="pill ${t.status==='draft'?'accent':'blue'}">${t.status==='draft'?'Ready to review':'In progress'}</span><span class="private-marker">${icon('lock')} Only you</span></div><h2>${esc(t.name)}</h2><p class="subhead">${esc(t.field)} · ${esc(t.area)} ha · ${t.observations.length} observations</p></div><div class="trial-hero-art">${plotArt('timing','home')}<div class="plot-legend"><span><i></i>Usual practice</span><span><i></i>Earlier sowing</span></div></div><div class="trial-hero-bottom"><span class="tiny muted">${t.status==='draft'?'Next: review the comparison':'Next: record establishment'}</span><button class="btn primary" data-action="${t.status==='draft'?'open-trial':'record'}" data-id="current">${t.status==='draft'?'Review plan':'Add observation'} ${icon('arrow','small-icon')}</button></div></article>${smallTitle('Your next steps')}<div class="utility-grid"><button class="action-tile" data-action="sandbox" data-id="seed">${tag(getPlugin('seed'))}<span class="grow"><strong>Compare seed quotes</strong><p>Current vs. alternative</p></span>${icon('chevron')}</button><button class="action-tile" data-action="import">${tag(getPlugin('sheet'))}<span class="grow"><strong>Bring a spreadsheet</strong><p>CSV from Excel or Sheets</p></span>${icon('chevron')}</button></div>${smallTitle('Working with',`<button class="text-link" data-action="nav" data-page="plugins">Manage ${icon('arrow','small-icon')}</button>`)}<div class="mini-tools">${allPlugins().filter(p=>state.enabled[p.id]).map(p=>`<button class="tool-chip" data-action="detail" data-id="${p.id}">${icon(p.icon)}${esc(p.name)}</button>`).join('')||'<span class="small muted">No active plug-ins.</span>'}</div><div class="home-community"><div class="between"><span class="eyebrow">From your community</span><button class="text-link" data-action="nav" data-page="community">Explore ${icon('arrow','small-icon')}</button></div><button class="mini-post" data-action="open-post" data-id="mulch">${avatar(PEOPLE.maya)}<span class="grow"><strong>Less weeding. Same beds.</strong><p>Maya’s leaf-mulch trial · see the method</p></span>${icon('chevron','small-icon')}</button></div></section>${rail()}</div>`}
function rail(){return `<aside class="context-rail" aria-label="Workspace context"><div class="eyebrow">At a glance</div><div class="rail-block"><div class="row">${icon('farm')}<div><h3 style="margin:0">${esc(me().farm)}</h3><span class="tiny muted">3 fields · ${esc(me().area)} · private</span></div></div></div><div class="rail-block"><div class="between"><h3 style="margin:0">Your records</h3><button class="text-link" data-action="import">Add</button></div>${state.sources.slice(0,2).map((s,i)=>`<button class="rail-link" data-action="source-preview" data-index="${i}">${icon('sheet','small-icon')}<span class="grow"><strong style="overflow-wrap:anywhere">${esc(s.name)}</strong><small>${s.rows.length} rows · read-only copy</small></span>${icon('chevron')}</button>`).join('')||'<p class="tiny muted">No records added.</p>'}</div><div class="rail-block"><h3>One thing to remember</h3><p class="rail-note">“${esc(state.notes[0]?.text||'Start with what already works.')}”</p><button class="text-link" data-action="nav" data-page="farm">Edit farm context ${icon('arrow','small-icon')}</button></div>${state.proposals.length?`<button class="approval-row" data-action="review">${icon('inbox','small-icon')}<span>${state.proposals.length} update to review</span>${icon('arrow','small-icon')}</button>`:''}<div class="rail-block" style="border-bottom:0"><h3>Your circles</h3>${CIRCLES.filter(c=>state.community.joined.includes(c.id)).map(c=>`<button class="rail-link" data-action="circle" data-id="${c.id}"><span class="rail-circle">${icon(c.icon,'small-icon')}</span><span class="grow"><strong>${c.name}</strong><small>${c.members} growers · demo</small></span></button>`).join('')}</div></aside>`}
function messageHTML(m){if(m.role==='user')return `<div class="user-bubble">${esc(m.text)}</div>`;if(m.role==='typing')return `<div class="typing"><i></i><i></i><i></i></div>`;return `<div class="agent-message"><div class="agent-label"><span class="assistant-symbol">${icon('spark')}</span>Fieldwork<span class="time">Demo response</span></div><p>${esc(m.text)}</p>${m.kind==='plugin'?pluginResponse(m.id):m.kind==='community'?communityResponse(m.postId):m.kind==='custom'?`<div class="tool-card"><h3>Make a reusable approach</h3><div class="buttons"><button class="btn primary" data-action="custom" data-text="${esc(m.prompt||'')}">Create draft ${icon('arrow','small-icon')}</button></div></div>`:m.kind==='import'?`<div class="tool-card"><div class="row">${tag(getPlugin('sheet'))}<h3>Spreadsheet bridge</h3></div><div class="buttons"><button class="btn primary" data-action="import">Choose CSV</button></div></div>`:m.kind==='update'?`<div class="tool-card"><h3>${state.proposals.length} proposed update</h3><div class="buttons"><button class="btn primary" data-action="review">Review changes</button></div></div>`:m.kind==='note'?`<div class="tool-card"><button class="btn secondary" data-action="note" data-text="${esc(m.prompt||'')}">Review & save note</button></div>`:`<div class="followups"><button class="prompt-option" data-action="nav" data-page="plugins">Open plug-ins ↗</button><button class="prompt-option" data-action="nav" data-page="community">Explore experiments ↗</button></div>`}</div>`}
function pluginResponse(id){const p=getPlugin(id);return `<div class="tool-card"><div class="row">${tag(p)}<div class="grow"><h3>${esc(p.name)}</h3><span class="tiny muted">${esc(p.kind)} · v${esc(state.versions[id]||p.version)}</span></div><span class="pill outline">${state.enabled[id]?'Active':'Not enabled'}</span></div><div class="buttons"><button class="btn primary" data-action="sandbox" data-id="${id}">Try sample ${icon('arrow','small-icon')}</button><button class="btn secondary" data-action="detail" data-id="${id}">See method</button></div></div>`}
function communityResponse(id){const p=postById(id);if(!p)return '';return `<div class="tool-card"><span class="pill accent">From ${esc(person(p.author).farm)}</span><h3 style="margin-top:12px">${esc(p.method)}</h3><p>Keep your baseline. Adapt the area, budget and observations before starting.</p><div class="buttons"><button class="btn primary" data-action="adapt-post" data-id="${p.id}">Draft my version</button><button class="btn secondary" data-action="open-post" data-id="${p.id}">Original trial</button></div></div>`}
function sendMessage(text){text=(text||$('#message').value).trim();if(!text)return;if(text.length>2000){toast('Keep this demo message under 2,000 characters.');return}$('#message').value='';$('#message').style.height='auto';if(page!=='assistant')page='assistant';closeDialog();state.messages.push({role:'user',text});const lower=text.toLowerCase();let r={role:'assistant',kind:'general',text:'Which decision are we working on? Start with a cost comparison, a trial, or a record you already keep.'};if(/spreadsheet|csv|excel|records|sheets/.test(lower))r={role:'assistant',kind:'import',text:'Let’s use a copy of your spreadsheet. You choose the columns.'};else if(/weather|forecast|rain|wind/.test(lower))r={role:'assistant',kind:'plugin',id:'weather',text:'Check a forecast window against your own limits. The sample stays separate from field decisions.'};else if(/satellite|ndvi|imagery|scout|photo/.test(lower))r={role:'assistant',kind:'plugin',id:'satellite',text:'Start with a place to look more closely, not a diagnosis from a map.'};else if(/custom|my own|routine|always/.test(lower))r={role:'assistant',kind:'custom',prompt:text,text:'Let’s save that as a draft method. You approve the steps and access.'};else if(/update|version|approval/.test(lower))r={role:'assistant',kind:'update',text:'The current workflow stays active until you approve a change.'};else if(/remember|usually|stays wet/.test(lower))r={role:'assistant',kind:'note',prompt:text,text:'Keep that as your observation. Review it before it becomes farm context.'};else if(/trial|experiment|rotation|cover|mulch/.test(lower))r={role:'assistant',kind:'plugin',id:'trial',text:'Keep what you do now as the baseline. Choose one change and a useful comparison.'};else if(/seed|cost|price|budget/.test(lower))r={role:'assistant',kind:'plugin',id:'seed',text:'Compare the purchase costs first. Cheaper seed does not, by itself, mean better value.'};state.messages.push(r);persist();render();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),50)}
function pluginsPage(){return `<section class="page v2 plugins-page"><div class="compact-heading"><div><div class="eyebrow">Your toolbox</div><h1>Plug-ins</h1></div><button class="btn secondary" data-action="custom">${icon('plus','small-icon')} Create</button></div><div class="plugins-layout"><div><div class="library-tabs" role="tablist" aria-label="Plug-in collection"><button role="tab" aria-selected="${libraryTab==='mine'}" class="${libraryTab==='mine'?'active':''}" data-action="library-tab" data-tab="mine">My plug-ins <span class="count">${Object.keys(state.installed).filter(k=>state.installed[k]).length+state.custom.filter(x=>!state.installed[x.id]).length}</span></button><button role="tab" aria-selected="${libraryTab==='discover'}" class="${libraryTab==='discover'?'active':''}" data-action="library-tab" data-tab="discover">Explore</button></div><div class="searchbar">${icon('search','small-icon')}<label class="sr-only" for="plugin-search">Search plug-ins</label><input id="plugin-search" placeholder="Find a method or data source" value="${esc(search)}"></div><div class="filters" aria-label="Filter plug-ins">${['All','Costs','Weather','Imagery','Methods','Records'].map(c=>`<button class="${category===c?'active':''}" data-action="filter" data-filter="${c}" aria-pressed="${category===c}">${c}</button>`).join('')}</div><div id="plugin-list">${pluginList()}</div><button class="add-row" data-action="custom"><span><strong>Make your own approach</strong><small>Start from a routine or an idea.</small></span>${icon('plus')}</button>${state.proposals.length?`<button class="approval-row" style="margin-top:17px" data-action="review">${icon('inbox','small-icon')}<span>${state.proposals.length} workflow update to review</span>${icon('chevron','small-icon')}</button>`:''}</div><aside class="plugin-library-aside" style="display:none"><div class="farm-block"><h3>Built on your records</h3><button class="rail-link" data-action="import">${icon('sheet')}<span class="grow"><strong>Bring a CSV</strong><small>Keep the original unchanged.</small></span>${icon('chevron')}</button></div><div class="farm-block" style="margin-top:17px"><h3>From the community</h3><button class="rail-link" data-action="open-post" data-id="mulch">${avatar(PEOPLE.maya)}<span class="grow"><strong>Leaf-mulch comparison</strong><small>See a trial. Adapt the method.</small></span></button><button class="text-link" data-action="nav" data-page="community">Explore experiments ${icon('arrow','small-icon')}</button></div></aside></div></section>`}
function pluginCard(p){const installed=state.installed[p.id],on=state.enabled[p.id];return `<article class="plugin-card">${tag(p)}<button class="plugin-card-main" data-action="detail" data-id="${p.id}"><h3>${esc(p.name)}</h3><p>${esc(SHORT_DESC[p.id]||'Your reusable instruction template.')}</p><span class="status-row">${installed?`<span class="dot" style="${on?'':'background:var(--faint)'}"></span>${on?'Active':'Paused'} · v${esc(state.versions[p.id]||p.version)}`:p.custom?'Draft · not enabled':esc(p.kind)}</span></button><div class="plugin-card-controls"><button class="btn secondary" data-action="${installed?'sandbox':'detail'}" data-id="${p.id}">${installed?'Open':'Explore'}</button></div></article>`}
function detail(id){const p=getPlugin(id);if(!p)return;const installed=!!state.installed[id],on=!!state.enabled[id],v=state.versions[id]||p.version,h=state.history[id]||[];showDialog(p.name,`<p class="detail-summary">${esc(SHORT_DESC[id]||p.benefit)}</p><div class="detail-brief"><div><strong>${esc(v)}</strong><span>Pinned version</span></div><div><strong>${p.inputs.length}</strong><span>Inputs</span></div><div><strong>${installed?(on?'Active':'Paused'):'Draft'}</strong><span>${installed?'Your workspace':'Not enabled'}</span></div></div>${accordion('Inputs',p.inputs.map(x=>`<div class="mini-step">${icon('check','small-icon')}<span>${esc(x)}</span></div>`).join(''))}${accordion('Method & your adaptation',(state.overrides[id]?`<div class="saved-notice">${icon('check','small-icon')}<span>${esc(state.overrides[id])}</span></div>`:'')+p.steps.map((s,i)=>`<div class="mini-step"><span class="step-num">${i+1}</span><span>${esc(s)}</span></div>`).join('')+`<button class="text-link" data-action="${installed?'propose-edit':'customize'}" data-id="${id}">${installed?'Propose an update':'Adapt this method'} ${icon('arrow','small-icon')}</button>`)}${accordion('Evidence & limits',`<p>${esc(p.evidence)}</p>${p.source?sourceLink(p.source):'<p>Source: the records you choose to provide.</p>'}<div class="inline-warning">${esc(p.limits)}</div>`)}${accordion('Access & permissions',`<p>${esc(p.permission)}</p><p>No purchases, source-file edits or external sharing. Updates need approval.</p>`)}${installed?`<div class="control-row"><span class="small">Enabled for your farm</span><button class="install-toggle ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="Enable ${esc(p.name)}" data-action="toggle" data-id="${id}"></button></div>`:''}${h.length?`<button class="text-link" data-action="rollback" data-id="${id}">${icon('undo','small-icon')} Restore v${esc(h[h.length-1].version)}</button>`:''}`,`<button class="btn secondary" data-action="sandbox" data-id="${id}">Try sample</button><button class="btn primary" data-action="${installed?'customize':'activate'}" data-id="${id}">${installed?'Make a copy':'Review & add'} ${icon('arrow','small-icon')}</button>`,p,p.custom?'Your method':`${p.kind} · ${p.cat}`)}
function activation(id){const p=getPlugin(id);showDialog('Add to your farm',`<div class="row">${tag(p)}<div><h3>${esc(p.name)}</h3><span class="tiny muted">v${esc(state.versions[id]||p.version)} · suggestions only</span></div></div><div class="rule"></div><h3 style="font-size:12px">Allowed access</h3><p class="detail-summary" style="margin-top:8px">${esc(p.permission)}</p>${accordion('Boundaries',`<p>No source-file changes, purchases, external sharing, or automatic plug-in activation. Version updates require a separate approval.</p>`)}<label class="check-line"><input id="activation-consent" type="checkbox"><span>I approve this version and access.</span></label><p class="source-footnote">Demo activation only. No outside service is connected.</p>`,`<button class="btn secondary" data-action="detail" data-id="${id}">Back</button><button class="btn primary" id="approve-activation" data-action="approve-activation" data-id="${id}" disabled>Approve & enable</button>`)}
function communityPage(){return `<section class="page v2 feed-page"><div class="community-layout"><div><div class="compact-heading feed-heading"><div><h1>Community</h1><button class="circle-picker" data-action="circles">${icon('pin')} Your circles ${icon('down')}</button></div><div class="row" style="gap:4px"><button class="icon-btn" data-action="feed-search" aria-label="Search community">${icon('search')}</button><button class="btn secondary feed-share-top" data-action="share-choose">${icon('plus','small-icon')} Share</button></div></div><div class="feed-top-tabs" role="tablist" aria-label="Community feed">${[['for-you','For you'],['following','Following'],['saved','Saved']].map(([id,label])=>`<button role="tab" aria-selected="${feedTab===id}" class="${feedTab===id?'active':''}" data-action="feed-tab" data-tab="${id}">${label}${id==='saved'&&state.community.saved.length?` <span class="count">${state.community.saved.length}</span>`:''}</button>`).join('')}</div><div class="feed-filters" aria-label="Content type">${[['All',null],['Experiments','flask'],['Products','product']].map(([c,ic])=>`<button class="filter-chip ${feedFilter===c?'active':''}" aria-pressed="${feedFilter===c}" data-action="feed-filter" data-filter="${c}">${ic?icon(ic):''}${c}</button>`).join('')}<button class="filter-chip" data-action="feed-interests" aria-label="Feed preferences">${icon('settings')}</button></div><div class="share-prompt">${avatar(me())}<button data-action="share-choose">Share a trial or field note…</button><button class="icon-btn" data-action="share-choose" aria-label="Create a community post">${icon('plus')}</button></div><div id="community-posts">${feedPosts()}</div><p class="quiet-note">Demo community. People, posts, products and results are fictional.</p></div><aside class="community-aside">${communityAside()}</aside></div></section>`}
function filteredPosts(){return allPosts().filter(p=>(feedFilter==='All'||(feedFilter==='Products'?p.type==='product':p.type==='experiment'))&&(feedTab==='for-you'||(feedTab==='following'?state.community.following.includes(p.author)||p.author==='me':state.community.saved.includes(p.id)))).sort((a,b)=>{if(feedTab!=='for-you')return 0;const score=p=>p.author==='me'?100:state.community.interests.includes(p.topic)?5:0;return score(b)-score(a)});}
function feedPosts(){const list=filteredPosts();return list.length?`<div class="feed-stack">${list.map(postCard).join('')}</div>`:`<div class="saved-empty">${icon(feedTab==='saved'?'bookmark':'community')}<h3>${feedTab==='saved'?'Keep something worth revisiting.':'Nothing in this view yet.'}</h3><p>${feedTab==='saved'?'Save an experiment or product from the feed.':'Follow a grower or try another filter.'}</p><button class="btn secondary" data-action="feed-reset">Explore the community</button></div>`}
function postCard(p){if(p.type==='product')return productCard(p);const who=person(p.author)||me(),saved=state.community.saved.includes(p.id),liked=state.community.liked.includes(p.id),cc=(p.comments?.length||0)+(state.community.comments[p.id]?.length||0);return `<article class="feed-card" data-post="${p.id}"><div class="post-top"><button class="avatar-button" data-action="profile" data-id="${who.id}" aria-label="View ${esc(who.name)}’s profile">${avatar(who)}</button><button class="author-link" data-action="profile" data-id="${who.id}"><strong>${esc(who.name)} <span style="font-weight:400;color:var(--faint)">· ${p.author==='me'?'you':p.time}</span></strong><small>${esc(who.farm)}${p.region?' · '+esc(p.region):''}</small></button><button class="icon-btn save-button ${saved?'is-saved':''}" data-action="save-post" data-id="${p.id}" aria-label="${saved?'Unsave':'Save'} ${esc(p.title)}" aria-pressed="${saved}">${icon('bookmark')}</button></div><div class="post-copy"><div class="post-type">${p.type==='note'?'Field note':'Experiment'} <span class="sep">/</span> ${esc(p.result||'In progress')}${p.author==='me'?` <span class="sep">/</span> ${p.audience==='circle'?'Circle only':'Community'}`:''}</div><button style="text-align:left;padding:0" data-action="open-post" data-id="${p.id}"><h2>${esc(p.title)}</h2></button><p>${esc(p.body)}</p></div>${p.type==='note'?'':postVisual(p)}${p.metrics?.length?`<div class="post-result">${p.metrics.slice(0,2).map(([v,l])=>`<div><strong style="${v.length>16?'font-size:15px':''}">${esc(v)}</strong><small>${esc(l)}</small></div>`).join('')}</div>`:''}${p.scope?`<div class="post-scope">${icon('flask')} ${esc(p.scope)}</div>`:''}<div class="post-actions"><div class="reactions"><button class="reaction ${liked?'selected':''}" data-action="like-post" data-id="${p.id}" aria-label="${liked?'Remove appreciation':'Appreciate post'}" aria-pressed="${liked}">${icon('heart')}<span>${(p.likes||0)+(liked?1:0)}</span></button><button class="reaction" data-action="comments" data-id="${p.id}" aria-label="Read ${cc} comments">${icon('chat')}<span>${cc}</span></button></div><div class="post-cta">${p.type!=='note'?`<button class="btn secondary" data-action="open-post" data-id="${p.id}">View trial</button>${p.steps?.length?`<button class="btn primary" data-action="adapt-post" data-id="${p.id}">Try method ${icon('arrow')}</button>`:''}`:`<button class="btn secondary" data-action="open-post" data-id="${p.id}">Read note</button>`}</div></div></article>`}
function productCard(p){const saved=state.community.saved.includes(p.id);return `<article class="feed-card"><div class="post-top"><span class="tag-icon neutral" style="height:34px;width:34px">${icon('product')}</span><div class="grow"><strong style="font-size:12px">New in the toolbox</strong><p class="tiny muted">${p.sponsored?'Sponsored · ':''}Demo listing</p></div><button class="icon-btn save-button ${saved?'is-saved':''}" data-action="save-post" data-id="${p.id}" aria-label="${saved?'Unsave':'Save'} product" aria-pressed="${saved}">${icon('bookmark')}</button></div><div class="post-copy"><h2>${esc(p.title)}</h2><p>${esc(p.body)}</p></div><div class="product-media">${productArt()}</div><div class="post-actions"><div style="padding-left:5px"><strong style="font-size:14px">${p.price}</strong><p class="tiny muted">CAD · illustrative</p></div><button class="btn secondary" data-action="product-detail" data-id="${p.id}">Check fit ${icon('arrow','small-icon')}</button></div><div class="post-internal-note">${esc(p.reason)} <button class="text-link" style="font-size:10px;min-height:26px" data-action="why-product" data-id="${p.id}">Why this?</button></div></article>`}
function communityAside(){return `<div class="card"><div class="between"><h3>Your circles</h3><button class="text-link" data-action="circles">Manage</button></div>${CIRCLES.filter(c=>state.community.joined.includes(c.id)).map(c=>`<button class="circle-row" data-action="circle" data-id="${c.id}"><span class="rail-circle">${icon(c.icon,'small-icon')}</span><span><strong>${c.name}</strong><small>${c.members} growers</small></span></button>`).join('')}</div><div class="aside-rule"><div class="between"><h3>Growers to learn with</h3></div>${Object.values(PEOPLE).filter(p=>!state.community.following.includes(p.id)).slice(0,2).map(p=>`<button class="person-row" data-action="profile" data-id="${p.id}">${avatar(p)}<span><strong>${p.name}</strong><small>${p.crops}</small></span>${icon('chevron','small-icon')}</button>`).join('')||'<p class="aside-muted" style="margin-top:12px">You’re following all the example growers.</p>'}</div><div class="aside-rule"><div class="row">${icon('shield','small-icon')}<h3>Your farm stays private.</h3></div><p class="aside-muted" style="margin-top:10px">Only the content you preview and approve appears in your community profile.</p><button class="text-link" data-action="profile" data-id="me">View your profile ${icon('arrow','small-icon')}</button></div><p class="quiet-note">Likes show interest, not scientific confidence. Inspect the method before adapting it.</p>`}
function openPost(id){const p=postById(id);if(!p)return;if(p.type==='product'){productDetail(id);return}const who=person(p.author)||me();showDialog(p.type==='note'?'Shared field note':'Shared experiment',`<button class="row" style="padding:0;text-align:left" data-action="profile" data-id="${who.id}">${avatar(who)}<span><strong class="small">${esc(who.name)}</strong><small class="tiny muted" style="display:block">${esc(who.farm)} · ${esc(p.season||'2026')}</small></span></button><h2 class="serif" style="font-size:27px;font-weight:400;margin:18px 0 10px">${esc(p.title)}</h2><p class="detail-summary">${esc(p.body)}</p>${p.type==='note'?'':postVisual(p,true)}${p.metrics?.length?`<div class="facts-grid">${p.metrics.map(([v,l])=>`<div><strong>${esc(v)}</strong><small>${esc(l)}</small></div>`).join('')}</div>`:''}${p.values?`<div class="result-plot"><span class="tiny muted">${esc(p.factor)} · ${esc(p.units)} · simulated</span>${p.values.map((v,i)=>`<div class="plot-row"><span>${i?'Leaf mulch':'Usual practice'}</span><div class="plot-track"><div class="plot-fill ${i?'':'base'}" style="width:${v/Math.max(...p.values)*100}%"></div></div><strong>${v} h</strong></div>`).join('')}</div>`:''}${p.type==='note'?'':accordion('The comparison',`<p><strong>Question:</strong> ${esc(p.question||'A farmer-led comparison.')}</p><p><strong>Usual practice:</strong> ${esc(p.baseline||'Not shared')}</p><p><strong>One change:</strong> ${esc(p.change||'Not shared')}</p><p><strong>Scope:</strong> ${esc(p.scope||'Not shared')}</p>`,true)}${p.steps?.length?accordion('Method to adapt',p.steps.map((s,i)=>`<div class="mini-step"><span class="step-num">${i+1}</span><span>${esc(s)}</span></div>`).join('')):''}${p.photos?.length?`<div class="post-preview-photos">${p.photos.map(x=>`<img src="${x}" alt="Approved shared field observation">`).join('')}</div>`:''}${accordion('Evidence & limitations',`<p>${esc(p.limits||'A farmer-reported observation, not an independently validated conclusion.')}</p>${(p.sources||[]).map(sourceLink).join('')}<p>Community names and example results in this prototype are fictional. Reactions are not evidence of effectiveness.</p>`)}${p.author==='me'?`<button class="text-link" data-action="unshare-post" data-id="${p.id}">${icon('lock','small-icon')} Remove from community</button>`:''}`,`<button class="btn secondary" data-action="comments" data-id="${p.id}">Discussion</button>${p.type!=='note'&&p.steps?.length?`<button class="btn primary" data-action="adapt-post" data-id="${p.id}">Try this on my farm ${icon('arrow','small-icon')}</button>`:`<button class="btn primary" data-action="close">Done</button>`}`)}
function adaptPost(id){const p=postById(id);if(!p||p.type==='product')return;showDialog('Make this trial yours',`<div class="row">${avatar(person(p.author)||me())}<div><strong class="small">${esc(p.method||p.title)}</strong><p class="tiny muted">From ${esc((person(p.author)||me()).farm)} · original unchanged</p></div><div class="form-field"><label for="adapt-name">Your trial name</label><input id="adapt-name" maxlength="90" value="${esc(p.method||p.title)}"></div><div class="form-field"><label for="adapt-field">Field</label><select id="adapt-field"><option>North field</option><option>River field</option><option>Home field</option></select></div><div class="form-field"><label for="adapt-baseline">What you do now</label><textarea id="adapt-baseline" rows="2" style="min-height:65px" maxlength="500">${esc(p.baseline||'Our usual practice')}</textarea></div><div class="form-field"><label for="adapt-change">The change to test</label><textarea id="adapt-change" rows="2" style="min-height:65px" maxlength="500">${esc(p.change||'One change, reviewed locally')}</textarea></div><div class="pair-fields"><div class="form-field"><label for="adapt-area">Maximum area · ha</label><input id="adapt-area" type="number" min="0.01" max="4" step="0.01" value="${p.area||.2}"></div><div class="form-field"><label for="adapt-budget">Spending limit · CAD</label><input id="adapt-budget" type="number" min="0" max="100000" step="1" value="${p.budget||100}"></div></div>${accordion('Method & limits',`<p>${esc(p.limits||'Review the design locally before starting.')}</p><p>A small area does not automatically make a trial informative. Review comparability, replication and measurement before field work.</p>${(p.steps||[]).map((s,i)=>`<div class="mini-step"><span class="step-num">${i+1}</span><span>${esc(s)}</span></div>`).join('')}`)}<div class="privacy-strip">${icon('lock')}<span>Private draft. No method activates and no field work is scheduled.</span></div><div id="adapt-error" class="error-message" role="alert"></div>`,`<button class="btn secondary" data-action="open-post" data-id="${id}">Original trial</button><button class="btn primary" data-action="save-adapt" data-id="${id}">Save my version</button>`)}
function saveAdapt(id){const p=postById(id),name=$('#adapt-name').value.trim(),baseline=$('#adapt-baseline').value.trim(),change=$('#adapt-change').value.trim(),area=$('#adapt-area'),budget=$('#adapt-budget');if(!name||!baseline||!change||!area.value||!budget.value||!area.checkValidity()||!budget.checkValidity()){$('#adapt-error').textContent='Add the name, both approaches, an area within the selected field and a non-negative budget.';return}const t={id:'trial-'+Date.now(),name,field:$('#adapt-field').value,question:p.question||name,baseline,change,area:Number(area.value),budget:Number(budget.value),status:'draft',observations:[],sourcePost:id,methodVersion:'1.0',methodKey:p.methodKey||'trial',steps:[...(p.steps||[])],outcome:'',result:'Not started',limits:p.limits};state.community.trials.unshift(t);persist();go('trials');openTrial(t.id);toast('Private trial draft created. Original method unchanged.');}
function productDetail(id){const p=postById(id);if(!p)return;showDialog(p.name,`<span class="pill outline">${p.sponsored?'Sponsored · ':''}Fictional product concept</span><div class="product-media" style="border-radius:12px;border:1px solid var(--line);margin-top:16px">${productArt()}</div><p class="detail-summary" style="margin-top:15px">${esc(p.body)}</p><div class="facts-grid">${p.specs.map(([v,l])=>`<div><strong>${v}</strong><small>${l}</small></div>`).join('')}</div><h3 style="font-size:13px;margin:20px 0 5px">Worth investigating for your farm?</h3><label class="check-line"><input type="checkbox"><span>I need ground-temperature readings.</span></label><label class="check-line"><input type="checkbox"><span>I’m willing to log readings manually.</span></label><label class="check-line"><input type="checkbox"><span>I don’t already have a suitable probe.</span></label>${accordion('Why it appears & what to verify',`<p>${p.reason}. Sponsorship is disclosed separately from evidence; it is not an endorsement.</p><p>Before purchasing a real product, verify accuracy, measurement range, durability, total cost and independent user experience.</p><p>${esc(p.limits)}</p>`)}<div class="inline-warning">Demo listing only. Nothing can be purchased here.</div>`,`<button class="btn secondary" data-action="save-post" data-id="${id}">${state.community.saved.includes(id)?'Unsave':'Save for later'}</button><button class="btn primary" data-action="ask-product" data-id="${id}">Ask Fieldwork</button>`)}
function showProfile(id){profileId=id;profileTab='shared';page='profile';closeDialog();render();window.scrollTo(0,0)}
function profilePage(){const own=profileId==='me',p=person(profileId)||me(),posts=allPosts().filter(x=>x.author===profileId),following=state.community.following.includes(profileId);return `<section class="page v2 profile-page"><div class="between" style="margin-bottom:16px"><button class="text-link" data-action="nav" data-page="${own?'farm':'community'}">${icon('back','small-icon')} ${own?'My farm':'Community'}</button><span class="pill outline">Demo profile</span></div><div class="profile-cover">${landscapeArt()}<span class="pill">${own?'Community profile':'Grower profile'}</span></div><div class="profile-identity">${avatar(p,'large')}<button class="btn ${own?'secondary':following?'secondary':'primary'}" data-action="${own?'edit-profile':'follow'}" data-id="${profileId}">${own?'Edit profile':following?'Following':'Follow'}</button></div><div class="profile-heading"><h1>${esc(p.farm)}</h1><p>${esc(p.name)}${(own?p.showRegion:true)?' · '+esc(p.region):''} · ${esc(p.crops)}</p><p style="color:var(--ink)">${esc(p.bio)}</p></div><div class="profile-tags">${(p.focus||['Small trials','Rotations']).map(t=>`<span class="pill">${t}</span>`).join('')}</div><div class="profile-stats"><div><strong>${posts.length}</strong><span>Shared posts</span></div><div><strong>${own?state.community.following.length:p.following}</strong><span>Following</span></div><div><strong>${own?state.community.joined.length:p.followers+(following?1:0)}</strong><span>${own?'Circles':'Followers · sample'}</span></div></div><div class="feed-top-tabs"><button class="${profileTab==='shared'?'active':''}" data-action="profile-tab" data-tab="shared">Shared</button><button class="${profileTab==='about'?'active':''}" data-action="profile-tab" data-tab="about">About</button>${own?`<button class="text-link" style="margin-left:auto;color:var(--accent)" data-action="share-choose">${icon('plus','small-icon')} Share</button>`:''}</div><div class="profile-columns"><div>${profileTab==='shared'?(posts.length?`<div class="feed-stack">${posts.map(postCard).join('')}</div>`:`<div class="profile-empty">${icon('lock')}<h3 style="margin:12px 0 7px">Your trials are still private.</h3><p>Choose one to share when you’re ready.</p><button class="btn secondary" data-action="share-choose" style="margin-top:17px">Share an experiment</button></div>`):`<div class="farm-block"><h3>About this grower</h3><p class="detail-summary" style="margin-top:12px">${esc(p.bio)}</p><div class="source-row">${icon('farm','small-icon')}<span>${esc(p.crops)}</span></div>${(own?p.showRegion:true)?`<div class="source-row">${icon('pin','small-icon')}<span>${esc(p.region)} · approximate region only</span></div>`:''}<p class="source-footnote">Fictional profile for this interactive concept. No actual identity or community membership is implied.</p></div>`}</div><aside>${own?`<div class="farm-block"><div class="row">${icon('shield','small-icon')}<h3>Only what you share</h3></div><p class="aside-muted" style="margin-top:12px">Field boundaries, raw spreadsheets and private notes stay in your workspace.</p><button class="text-link" data-action="nav" data-page="trials">My private trials ${icon('arrow','small-icon')}</button></div>`:`<div class="farm-block"><h3>Shared interests</h3><div class="profile-tags">${p.focus.map(t=>`<span class="pill">${t}</span>`).join('')}</div><button class="text-link" data-action="circle" data-id="trials">Small-farm experiments ${icon('arrow','small-icon')}</button></div>`}</aside></div></section>`}
function editProfile(){const p=me();showDialog('Your community profile',`<div class="form-field"><label for="profile-name">Display name</label><input id="profile-name" maxlength="50" value="${esc(p.name)}"></div><div class="form-field"><label for="profile-farm">Farm name</label><input id="profile-farm" maxlength="60" value="${esc(p.farm)}"></div><div class="form-field"><label for="profile-bio">About your approach</label><textarea id="profile-bio" maxlength="250" rows="3">${esc(p.bio)}</textarea></div><div class="form-field"><label for="profile-crops">What you grow</label><input id="profile-crops" maxlength="70" value="${esc(p.crops)}"></div><div class="form-field"><label for="profile-region">Broad region</label><input id="profile-region" maxlength="60" value="${esc(p.region)}"></div><label class="check-line"><input type="checkbox" id="profile-region-show" ${p.showRegion?'checked':''}><span>Show my broad region on my profile.</span></label><div id="profile-error" class="error-message" role="alert"></div><p class="source-footnote">Saved only in this browser. No address or exact location is requested.</p>`,`<button class="btn secondary" data-action="close">Cancel</button><button class="btn primary" data-action="save-profile">Save profile</button>`)}
function comments(id){const p=postById(id);if(!p)return;const list=[...(p.comments||[]),...(state.community.comments[id]||[])];showDialog('Discussion',`<p class="small muted">${esc(p.title)}</p><div id="comments-list">${list.map(c=>{const u=person(c.author)||me();return `<div class="comment-item">${avatar(u)}<div><strong>${esc(u.name)}</strong><p>${esc(c.text)}</p></div></div>`}).join('')||'<p class="detail-summary" style="margin-top:20px">No comments yet.</p>'}</div><div class="comment-input"><label class="sr-only" for="comment-text">Add a comment</label><input id="comment-text" placeholder="Ask about the method…" maxlength="600"><button class="icon-btn" data-action="add-comment" data-id="${id}" aria-label="Post demo comment">${icon('arrowUp')}</button></div><p class="source-footnote">Comments are local to this demo, not sent to anyone.</p>`,`<button class="btn primary" data-action="open-post" data-id="${id}">Back to ${p.type==='product'?'product':'post'}</button>`)}
function circles(){showDialog('Your circles',`${CIRCLES.map(c=>`<div class="circle-row"><span class="rail-circle">${icon(c.icon,'small-icon')}</span><button data-action="circle" data-id="${c.id}" style="text-align:left;flex:1;padding:0"><strong>${c.name}</strong><small>${c.members} growers · demo</small></button><button class="btn secondary" style="min-height:34px;font-size:11px;padding:6px 10px" data-action="join-circle" data-id="${c.id}">${state.community.joined.includes(c.id)?'Joined':'Join'}</button></div>`).join('')}<div class="rule"></div><button class="text-link" data-action="feed-interests">${icon('settings','small-icon')} Edit feed interests</button><p class="source-footnote">Joining does not share any farm records.</p>`,`<button class="btn primary" data-action="close">Done</button>`)}
function circleDetail(id){const c=CIRCLES.find(x=>x.id===id);if(!c)return;showDialog(c.name,`<p class="detail-summary">${c.desc}</p><span class="pill outline">${c.members} growers · sample community</span><div class="section-head"><h2>Conversations to start with</h2></div>${COMMUNITY_POSTS.filter(p=>p.type==='experiment'&&(id!=='valley'||p.region==='Fraser Valley')&&(id!=='costs'||p.topic==='Input costs')).map(p=>`<button class="action-tile" style="margin-top:10px" data-action="open-post" data-id="${p.id}">${avatar(person(p.author))}<span class="grow"><strong>${p.title}</strong><p>${p.method}</p></span>${icon('chevron')}</button>`).join('')}<div class="privacy-strip">${icon('lock')}<span>Membership does not share your experiments. Choose this circle when you publish a specific post.</span></div>`,`<button class="btn secondary" data-action="join-circle" data-id="${id}">${state.community.joined.includes(id)?'Leave circle':'Join circle'}</button><button class="btn primary" data-action="close">Done</button>`)}
function interests(){showDialog('What’s useful to you?',`<p class="detail-summary">Choose topics for the For you feed.</p><div class="interest-options">${['Labour','Input costs','Cover crops','New tools','Vegetables','Grains'].map(t=>`<label><input type="checkbox" name="interest" value="${t}" ${state.community.interests.includes(t)?'checked':''}><span>${t}</span></label>`).join('')}</div><div class="privacy-strip">${icon('shield')}<span>Uses selected interests only, not private spreadsheet contents. Sponsorship is labelled separately.</span></div>`,`<button class="btn secondary" data-action="close">Cancel</button><button class="btn primary" data-action="save-interests">Save preferences</button>`)}

function trialCard(t){const shared=state.community.posts.some(p=>p.trialId===t.id);return `<article class="trial-row"><div class="between"><span class="pill ${t.status==='draft'?'accent':'blue'}">${t.status==='draft'?'Draft':t.status==='active'?'Tracking':'Completed · demo'}</span><span class="private-marker">${icon(shared?'community':'lock')}${shared?'Shared summary':'Only you'}</span></div><h3>${esc(t.name)}</h3><p class="small">${esc(t.field)} · ${esc(t.area)} ha · ${t.observations.length} observations</p>${t.status==='complete'?`<p class="small" style="margin-top:12px;color:var(--ink)">${esc(t.outcome||'Result recorded.')}</p>`:''}<div class="trial-row-bottom"><button class="btn secondary" data-action="open-trial" data-id="${t.id}">${t.status==='draft'?'Review plan':'Open experiment'}</button><button class="text-link" data-action="share-trial" data-id="${t.id}">${icon('share','small-icon')} Share</button></div></article>`}
function openTrial(id='current'){const t=trialById(id);if(!t)return;activeTrialId=id;const complete=t.status==='complete';showDialog(t.name,`<div class="between"><span class="pill ${t.status==='draft'?'accent':'blue'}">${t.status==='draft'?'Private draft':complete?'Completed · sample':'Tracking'}</span><span class="tiny muted">${esc(t.field)}</span></div>${t.sourcePost?`<button class="text-link" style="font-size:11px;margin-top:8px" data-action="open-post" data-id="${t.sourcePost}">${icon('branch','small-icon')} Adapted from a community trial</button>`:''}<div class="detail-brief" style="margin-top:17px"><div><strong>${esc(t.area)} ha</strong><span>Area cap</span></div><div><strong>${money(t.budget)}</strong><span>Budget cap</span></div><div><strong>${t.observations.length}</strong><span>Observations</span></div></div>${complete?`<p class="detail-summary" style="margin-top:15px">${esc(t.outcome)}</p><div class="facts-grid">${(t.metrics||[]).map(([v,l])=>`<div><strong>${esc(v)}</strong><small>${esc(l)}</small></div>`).join('')}</div>`:''}${accordion('The question & comparison',`<div class="form-field"><label for="plan-question">Question</label><textarea id="plan-question" maxlength="600" style="min-height:67px">${esc(t.question)}</textarea></div><div class="form-field"><label for="plan-baseline">Usual practice</label><textarea id="plan-baseline" maxlength="500" style="min-height:65px">${esc(t.baseline)}</textarea></div><div class="form-field"><label for="plan-change">One change</label><textarea id="plan-change" maxlength="500" style="min-height:65px">${esc(t.change)}</textarea></div><div class="pair-fields"><div class="form-field"><label for="plan-area">Maximum area · ha</label><input id="plan-area" type="number" min=".01" max="${fieldArea(t.field)}" step=".01" value="${esc(t.area)}"></div><div class="form-field"><label for="plan-budget">Spending limit · CAD</label><input id="plan-budget" type="number" min="0" max="100000" value="${esc(t.budget)}"></div></div><div id="plan-error" class="error-message" role="alert"></div><button class="btn secondary" data-action="plan-save" data-id="${id}">Save details</button>`,t.status==='draft')}${accordion('Method & measurements',`<p>Review the comparison, placement and replication before field work. Set the outcome and measurement schedule before starting.</p>${t.sourcePost?'<p>Copied method snapshot · v1.0. Changes on the original post do not update your trial.</p>':''}${(t.steps||getPlugin('trial').steps).map((s,i)=>`<div class="mini-step"><span class="step-num">${i+1}</span><span>${esc(s)}</span></div>`).join('')}<button class="text-link" data-action="detail" data-id="${t.methodKey||'trial'}">Inspect plug-in ${icon('arrow','small-icon')}</button>${sourceLink('sare')}`)}<div class="section-head between"><h2 style="font-size:13px">Observations</h2><button class="text-link" data-action="record" data-id="${id}">${icon('plus','small-icon')} Add</button></div>${t.observations.length?t.observations.map(o=>`<div class="observation-card"><p>${esc(o.text)}</p>${o.value?`<p style="margin-top:7px"><strong>${esc(o.value)}</strong>${o.unit?' '+esc(o.unit):''}</p>`:''}${o.photo?`<img src="${o.photo}" alt="Your locally attached field observation">`:''}<small>${esc(o.date)} · ${o.kind==='measured'?'Recorded measurement':o.kind==='deviation'?'Deviation from plan':'Farmer observation'}</small></div>`).join(''):'<p class="small muted" style="margin:9px 0 17px">No observations recorded yet.</p>'}`,`${t.status==='draft'?`<button class="btn secondary" data-action="share-trial" data-id="${id}">Share plan</button><button class="btn primary" data-action="start-tracking" data-id="${id}">Review tracking</button>`:`<button class="btn secondary" data-action="share-trial" data-id="${id}">${icon('share','small-icon')} Share summary</button><button class="btn primary" data-action="record" data-id="${id}">Add observation</button>`}`)}

function newExperiment(){showDialog('Start an experiment',`<div class="form-field"><label for="new-trial-name">What would you like to test?</label><input id="new-trial-name" maxlength="90" placeholder="e.g. Cover-crop establishment"></div><div class="form-field"><label for="new-trial-field">Field</label><select id="new-trial-field"><option>North field</option><option>River field</option><option>Home field</option></select></div><div class="form-field"><label for="new-trial-baseline">What do you do now?</label><textarea id="new-trial-baseline" maxlength="500" style="min-height:72px"></textarea></div><div class="form-field"><label for="new-trial-change">The one change</label><textarea id="new-trial-change" maxlength="500" style="min-height:72px"></textarea></div><p class="source-footnote">Start as a private draft. Set limits and review the design next.</p><div id="new-trial-error" class="error-message" role="alert"></div>`,`<button class="btn secondary" data-action="close">Cancel</button><button class="btn primary" data-action="save-new-trial">Create draft</button>`)}
function savePlan(id){const q=$('#plan-question').value.trim(),b=$('#plan-baseline').value.trim(),c=$('#plan-change').value.trim(),a=$('#plan-area'),budget=$('#plan-budget');if(!q||!b||!c||!a.value||!budget.value||!a.checkValidity()||!budget.checkValidity()){$('#plan-error').textContent='Fill in both approaches, an area within the selected field and a non-negative budget.';return false}updateTrial(id,{question:q,baseline:b,change:c,area:Number(a.value),budget:Number(budget.value)});persist();render();openTrial(id);toast('Trial details saved privately.');return true}
function recordObservation(id){const t=trialById(id);if(!t)return;activeTrialId=id;observationPhoto=null;showDialog('Add an observation',`<span class="pill outline">${esc(t.name)}</span><div class="form-field"><label for="obs-kind">Type</label><select id="obs-kind"><option value="note">Field note</option><option value="measured">Measurement</option><option value="deviation">Different from the plan</option></select></div><div class="form-field"><label for="obs-text">What happened?</label><textarea id="obs-text" maxlength="1600" placeholder="What you saw, measured, or did differently…" autofocus></textarea></div><div class="pair-fields"><div class="form-field"><label for="obs-value">Value · optional</label><input id="obs-value" maxlength="40" placeholder="e.g. 3.3"></div><div class="form-field"><label for="obs-unit">Unit · optional</label><input id="obs-unit" maxlength="50" placeholder="e.g. hours / bed"></div></div><div class="photo-attach"><input type="file" id="obs-photo" accept="image/jpeg,image/png,image/webp" hidden><button class="text-link" data-action="attach-photo">${icon('photo','small-icon')} Add photo</button><div id="photo-preview"></div></div><p class="source-footnote">Private record. Photos stay in this browser unless you explicitly include one in a shared post.</p><div id="obs-v2-error" class="error-message" role="alert"></div>`,`<button class="btn secondary" data-action="open-trial" data-id="${id}">Cancel</button><button class="btn primary" data-action="save-record" data-id="${id}">Save observation</button>`)}
function farmPage(){return `<section class="page v2 narrow"><div class="compact-heading"><div><div class="eyebrow">Private workspace</div><h1>${esc(me().farm)}</h1></div><button class="icon-btn" data-action="preferences" aria-label="Farm preferences">${icon('settings')}</button></div><button class="action-tile" data-action="profile" data-id="me" style="margin-bottom:20px">${avatar(me())}<span class="grow"><strong>Your community profile</strong><p>${state.community.posts.length} shared posts · ${state.community.following.length} following</p></span>${icon('chevron')}</button><div class="two-col"><div class="stack"><div class="farm-block"><div class="between"><h3>Fields</h3><span class="tiny muted">3 · 12 ha</span></div>${fieldMap('Sample field layout')}<div class="field-list"><span>North field</span><strong>4 ha</strong></div><div class="field-list"><span>River field</span><strong>6 ha</strong></div><div class="field-list"><span>Home field</span><strong>2 ha</strong></div></div><div class="farm-block"><div class="between"><h3>Farm knowledge</h3><button class="icon-btn" data-action="note" aria-label="Add farm knowledge">${icon('plus')}</button></div>${state.notes.map((n,i)=>`<button class="note-compact" data-action="edit-note" data-index="${i}"><p>${esc(n.text)}</p><small>${esc(n.field)} · farmer-reported</small></button>`).join('')}</div></div><div class="stack"><div class="farm-block"><div class="between"><h3>Records</h3><button class="icon-btn" data-action="import" aria-label="Add records">${icon('plus')}</button></div>${state.sources.map((s,i)=>`<button class="rail-link" data-action="source-preview" data-index="${i}">${icon('sheet','small-icon')}<span class="grow"><strong style="overflow-wrap:anywhere">${esc(s.name)}</strong><small>${s.rows.length} rows · read-only copy</small></span>${icon('chevron')}</button>`).join('')||'<p class="small muted">No records added.</p>'}<button class="text-link" data-action="import">Import a CSV ${icon('arrow','small-icon')}</button></div><div class="farm-block"><h3>How you like to work</h3><div class="segmented" aria-label="Exploration preference">${[['small','Small steps'],['balanced','A few options'],['explore','Explore widely']].map(([v,l])=>`<button data-action="pace" data-value="${v}" class="${state.prefs.pace===v?'active':''}" aria-pressed="${state.prefs.pace===v}">${l}</button>`).join('')}</div><button class="text-link" data-action="preferences">Sources & preferences ${icon('arrow','small-icon')}</button></div><div class="farm-block settings-list"><button data-action="review">${icon('inbox')}Approvals<span class="count">${state.proposals.length}</span>${icon('chevron')}</button><button data-action="export">${icon('download')}Export my workspace${icon('chevron')}</button><button data-action="about">${icon('info')}About this demo${icon('chevron')}</button><button data-action="theme">${icon('moon')}Switch theme${icon('chevron')}</button><button data-action="reset">${icon('undo')}Reset demo${icon('chevron')}</button></div></div></div></section>`}
function chooseShare(){showDialog('What would you like to share?',`${allTrials().map(t=>`<button class="action-tile" style="margin-bottom:10px" data-action="share-trial" data-id="${t.id}"><span class="tag-icon ${t.status==='complete'?'blue':'clay'}">${icon('flask')}</span><span class="grow"><strong>${esc(t.name)}</strong><p>${t.status==='complete'?'Completed':t.status==='active'?'In progress':'Plan draft'} · ${t.observations.length} observations</p></span>${icon('chevron')}</button>`).join('')}<button class="action-tile" data-action="share-note"><span class="tag-icon neutral">${icon('edit')}</span><span class="grow"><strong>A field note</strong><p>Write something for your community.</p></span>${icon('chevron')}</button><p class="source-footnote">Nothing from your workspace is shared automatically.</p>`,`<button class="btn secondary" data-action="close">Cancel</button>`)}
function startShare(id=null){const t=id?trialById(id):null;if(id&&!t)return;const existing=state.community.shareDraft;if(existing&&existing.trialId===id)shareWorking={...existing};else shareWorking={trialId:id,type:t?'experiment':'note',title:t?t.name:'',body:t?(t.outcome||t.question):'',audience:'private',circleId:state.community.joined[0]||'trials',includeMethod:!!t,includeCosts:false,includePhotos:false};shareForm()}
function shareForm(){const s=shareWorking,t=s.trialId?trialById(s.trialId):null;showDialog('Share with your community',`<div class="form-field" style="margin-top:0"><label for="share-title">Post title</label><input id="share-title" maxlength="110" value="${esc(s.title)}" placeholder="What did you learn?"></div><div class="form-field"><label for="share-body">Your takeaway</label><textarea id="share-body" maxlength="1000" rows="3" placeholder="What happened, and what would you do next?">${esc(s.body)}</textarea></div><label class="field-label">Audience</label><div class="audience-options">${[['private','Only me','Save a draft, not a post.','lock'],['circle','My circle','Share with a community you joined.','community'],['public','Fieldwork community','Visible on your community profile.','globe']].map(([v,l,d,ic])=>`<label class="audience-option"><input type="radio" name="share-audience" value="${v}" ${s.audience===v?'checked':''}><span class="grow"><strong>${l}</strong><small>${d}</small></span>${icon(ic)}</label>`).join('')}</div><div id="circle-select-wrap" class="form-field ${s.audience==='circle'?'':'hide'}"><label for="share-circle">Circle</label><select id="share-circle">${CIRCLES.filter(c=>state.community.joined.includes(c.id)).map(c=>`<option value="${c.id}" ${c.id===s.circleId?'selected':''}>${c.name}</option>`).join('')||'<option value="">Join a circle first</option>'}</select></div>${t?`<div class="share-controls"><label class="check-line"><input type="checkbox" id="share-method" ${s.includeMethod?'checked':''}><span>Include the reusable method<small>Usual practice, change and trial steps.</small></span></label><label class="check-line"><input type="checkbox" id="share-costs" ${s.includeCosts?'checked':''}><span>Include costs & budget<small>Off by default.</small></span></label>${t.observations.some(o=>o.photo)?`<label class="check-line"><input type="checkbox" id="share-photos" ${s.includePhotos?'checked':''}><span>Include observation photos<small>Review every photo in the preview for sensitive content.</small></span></label>`:''}</div>`:''}<div class="privacy-strip">${icon('shield')}<span>No field/location metadata, CSVs or private notes are attached. Check for sensitive details in the text and photos you choose.</span></div><div id="share-error" class="error-message" role="alert"></div>`,`<button class="btn secondary" data-action="save-share-draft">Save draft</button><button class="btn primary" id="share-preview-button" data-action="preview-share" ${s.audience==='private'?'disabled':''}>Preview post ${icon('arrow','small-icon')}</button><span class="footer-note">Demo only. Posts stay in this browser.</span>`)}
function collectShare(){const title=$('#share-title').value.trim(),body=$('#share-body').value.trim(),audience=document.querySelector('[name="share-audience"]:checked')?.value||'private';if(!title||!body){$('#share-error').textContent='Add a title and a takeaway before continuing.';return false}if(audience==='circle'&&!$('#share-circle').value){$('#share-error').textContent='Join a circle, or choose the wider community.';return false}Object.assign(shareWorking,{title,body,audience,circleId:$('#share-circle').value,includeMethod:!!$('#share-method')?.checked,includeCosts:!!$('#share-costs')?.checked,includePhotos:!!$('#share-photos')?.checked});return true}
function buildSharedPost(){const s=shareWorking,t=s.trialId?trialById(s.trialId):null;const costPattern=/cost|price|budget|purchase|spend|\$|€|£/i;const metrics=t?(t.metrics||[]).filter(m=>s.includeCosts||!costPattern.test(m.join(' '))).map(m=>[...m]):[];if(t&&s.includeCosts)metrics.push([money(t.budget),'Trial budget cap']);const c=CIRCLES.find(c=>c.id===s.circleId);const post={id:'shared-'+Date.now(),author:'me',trialId:s.trialId,type:s.type,title:s.title,body:s.body,audience:s.audience,audienceName:s.audience==='circle'?(c?.name||'Your circle'):'Fieldwork community',circleId:s.audience==='circle'?s.circleId:null,season:'2026',region:me().showRegion?me().region:'',time:'Just now',visual:t?.methodKey==='seed'?'seed':'timing',result:t?(t.status==='complete'?(t.result||'Completed'):t.status==='active'?'In progress':'Plan, not a result'):'Farmer observation',likes:0,comments:[],metrics,scope:t?(t.scope||'Farmer-shared plan · not validated'):'',limits:'Shared from a local prototype. A farmer observation or demo result is not independent evidence of a causal effect.',sources:[]};if(s.includeMethod&&t){Object.assign(post,{method:t.name,methodKey:t.methodKey||'trial',question:t.question,baseline:t.baseline,change:t.change,steps:t.steps||getPlugin('trial').steps,sources:['sare']})}if(s.includePhotos&&t)post.photos=t.observations.filter(o=>o.photo).map(o=>o.photo);return post}
function previewShare(){if(!collectShare())return;if(shareWorking.audience==='private'){toast('Choose a community audience first.');return}renderSharePreview()}
function renderSharePreview(){const p=buildSharedPost();showDialog('Preview your post',`<div class="row" style="margin-bottom:15px">${icon(p.audience==='circle'?'community':'globe','small-icon')}<span class="small">${esc(p.audienceName)}</span></div><div class="share-preview"><div class="post-top">${avatar(me())}<div><strong class="small">${esc(me().name)}</strong><p class="tiny muted">${esc(me().farm)}</p></div></div><div class="post-copy"><div class="post-type">${p.type==='note'?'Field note':'Experiment'} / ${esc(p.result)}</div><h2>${esc(p.title)}</h2><p>${esc(p.body)}</p></div>${p.metrics?.length?`<div class="post-result">${p.metrics.map(([v,l])=>`<div><strong style="font-size:16px">${esc(v)}</strong><small>${esc(l)}</small></div>`).join('')}</div>`:''}${p.photos?.length?`<div class="post-preview-photos" style="padding:0 15px">${p.photos.map(x=>`<img src="${x}" alt="Photo selected for sharing">`).join('')}</div>`:''}</div>${p.method?accordion('Method included in this post',`<p><strong>Question:</strong> ${esc(p.question)}</p><p><strong>Usual practice:</strong> ${esc(p.baseline)}</p><p><strong>One change:</strong> ${esc(p.change)}</p>${p.steps.map((x,i)=>`<div class="mini-step"><span class="step-num">${i+1}</span>${esc(x)}</div>`).join('')}`,false):''}<div class="privacy-strip">${icon('shield')}<span>${shareWorking.includeCosts?'Costs are included.':'Costs are hidden.'} Field/location metadata, CSVs and private notes are not attached. Your selected method, text and photos appear as previewed.</span></div><p class="source-footnote">This simulates sharing locally. No server, community member or outside service receives anything.</p>`,`<button class="btn secondary" data-action="edit-share">Edit</button><button class="btn primary" data-action="publish-share">${icon('share','small-icon')} Share ${p.audience==='circle'?'to circle':'to community'}</button>`)}
function publishShare(){if(!shareWorking||shareWorking.audience==='private')return;const post=buildSharedPost();state.community.posts.unshift(post);state.community.shareDraft=null;shareWorking=null;persist();feedTab='for-you';feedFilter='All';go('community');toast('Added to the demo feed. Nothing was sent online.');}
function about(){showDialog('About this demo',`<p class="detail-summary">Fieldwork · mobile-first workspace and community concept.</p><div class="inline-warning">All growers, products, results, memberships and farms are fictional. The assistant is scripted. No data or posts leave this page.</div>${accordion('Working interactions','<p>Feed filters, saves, follows, comments, editable profiles, opt-in post previews, private trial adaptations, observations and local photo uploads, plug-in approvals and version rollback, seed-cost calculations, CSV import and workspace export.</p>',true)}${accordion('What is not connected','<p>No live agent, weather service, satellite processing, product store or social backend. Custom plug-ins are instruction templates, not executed code. Community access controls are illustrated only; real multi-user security requires a backend.</p>')}${accordion('Storage & privacy',`<p>${storageAvailable?'Changes are stored in this browser.':'Browser storage is unavailable; export before closing.'} Exports include the full private workspace. Do not distribute an export as a public post. Use the sharing preview to select only the content meant for others.</p><p>Photo previews are resized in the browser; files are never uploaded. Clearing local browser storage removes saved state.</p>`)}${accordion('Method references',sourceLink('sare')+sourceLink('nasa')+sourceLink('weather'))}`,`<button class="btn secondary" data-action="export">Export workspace</button><button class="btn primary" data-action="close">Done</button>`)}

const v1Sandbox=sandbox;
sandbox=function(id){if(id!=='seed'){v1Sandbox(id);return}showDialog('Compare seed quotes',`<span class="pill accent">Sample inputs · CAD</span><div class="form-grid" style="margin-top:14px"><div class="form-field"><label for="price-a">Current · $ / bag</label><input id="price-a" type="number" min="0" max="100000" step=".01" value="120" data-calc></div><div class="form-field"><label for="price-b">Alternative · $ / bag</label><input id="price-b" type="number" min="0" max="100000" step=".01" value="108" data-calc></div><div class="form-field"><label for="bags">Bags / ha · both quotes</label><input id="bags" type="number" min=".01" max="10000" step=".01" value="1.5" data-calc></div><div class="form-field"><label for="area">Area · ha</label><input id="area" type="number" min=".01" max="1000000" step=".01" value="4" data-calc></div></div><div id="calculation"></div>${accordion('Calculation & limits','<p>Cost per hectare = price per bag × bags per hectare. Total difference = (current cost − alternative cost) × area.</p><p>Purchase cost only. Seed quality, shipping, variety and crop performance are not evaluated. The quantity is an input, not a sowing-rate recommendation.</p>')}<div class="tools-line">${icon('plugins')} Seed cost check · v1.0 · sample only</div>`,`<button class="btn secondary" data-action="customize" data-id="seed">Make it mine</button><button class="btn primary" data-action="activate" data-id="seed">Review & add</button>`);calculateSeed();};
function toggleArray(array,value){const i=array.indexOf(value);if(i<0)array.push(value);else array.splice(i,1)}
function preserveScrollRender(){const y=window.scrollY;render();window.scrollTo(0,y)}
function runSocialAction(b){const a=b.dataset.action,id=b.dataset.id;switch(a){
case 'ask-start':go('assistant');setTimeout(()=>$('#message').focus(),50);break;
case 'feed-tab':feedTab=b.dataset.tab;preserveScrollRender();break;
case 'feed-filter':feedFilter=b.dataset.filter;preserveScrollRender();break;
case 'feed-reset':feedTab='for-you';feedFilter='All';go('community');break;
case 'save-post':{toggleArray(state.community.saved,id);persist();const open=$('#sheet').open;preserveScrollRender();if(open&&postById(id)?.type==='product')productDetail(id);toast(state.community.saved.includes(id)?'Saved to your collection.':'Removed from saved.');break;}
case 'like-post':toggleArray(state.community.liked,id);persist();preserveScrollRender();break;
case 'open-post':openPost(id);break;
case 'adapt-post':adaptPost(id);break;
case 'save-adapt':saveAdapt(id);break;
case 'product-detail':productDetail(id);break;
case 'why-product':showDialog('Why this product?',`<p class="detail-summary">This demo placement relates to sowing-window trials and manual field observations.</p><p class="detail-summary">It is labelled as sponsored. Sponsorship and community popularity are not evidence of usefulness.</p><div class="action-stack"><button class="btn secondary" data-action="hide-post" data-id="${id}">Hide this listing</button><button class="btn secondary" data-action="feed-interests">Edit interests</button></div><p class="source-footnote">Fictional listing, not a real recommendation.</p>`,`<button class="btn primary" data-action="close">Done</button>`);break;
case 'hide-post':state.community.hidden.push(id);persist();closeDialog();preserveScrollRender();toast('Listing hidden.');break;
case 'ask-product':closeDialog();page='assistant';state.messages.push({role:'user',text:'Would this soil-temperature probe be useful for my trials?'},{role:'assistant',kind:'general',text:'It could add a ground observation to your sowing-date trial. First check whether your existing thermometer can do the job. This is a fictional listing, not a verified product recommendation.'});persist();render();window.scrollTo(0,0);break;
case 'profile':showProfile(id);break;
case 'profile-tab':profileTab=b.dataset.tab;preserveScrollRender();break;
case 'edit-profile':editProfile();break;
case 'save-profile':{const name=$('#profile-name').value.trim(),farm=$('#profile-farm').value.trim();if(!name||!farm){$('#profile-error').textContent='Add a display name and farm name.';return}Object.assign(state.community.profile,{name,farm,bio:$('#profile-bio').value.trim(),crops:$('#profile-crops').value.trim(),region:$('#profile-region').value.trim(),showRegion:$('#profile-region-show').checked});persist();showProfile('me');toast('Profile updated in this demo.');break;}
case 'follow':toggleArray(state.community.following,id);persist();preserveScrollRender();toast(state.community.following.includes(id)?'Following this example grower.':'Unfollowed.');break;
case 'comments':comments(id);break;
case 'add-comment':{const text=$('#comment-text').value.trim();if(!text){$('#comment-text').focus();return}state.community.comments[id]??=[];state.community.comments[id].push({author:'me',text});persist();preserveScrollRender();comments(id);$('#comment-text').focus();break;}
case 'circles':circles();break;
case 'circle':circleDetail(id);break;
case 'join-circle':{const isList=$('#sheet').getAttribute('aria-label')==='Your circles';toggleArray(state.community.joined,id);persist();preserveScrollRender();if(isList)circles();else circleDetail(id);toast('Demo membership updated. Your farm records stay private.');break;}
case 'feed-interests':interests();break;
case 'save-interests':state.community.interests=[...document.querySelectorAll('input[name=interest]:checked')].map(e=>e.value);persist();closeDialog();preserveScrollRender();toast('Feed preferences updated.');break;
case 'feed-search':showDialog('Find in your community',`<div class="searchbar">${icon('search','small-icon')}<label class="sr-only" for="community-search">Search experiments or growers</label><input id="community-search" placeholder="Experiments, methods, growers…" autofocus></div><div id="feed-search-results"></div>`,`<button class="btn secondary" data-action="close">Close</button>`);updateCommunitySearch('');break;
case 'trial-filter':trialFilter=b.dataset.filter;render();break;
case 'open-trial':openTrial(id);break;
case 'new-experiment':newExperiment();break;
case 'save-new-trial':{const name=$('#new-trial-name').value.trim(),baseline=$('#new-trial-baseline').value.trim(),change=$('#new-trial-change').value.trim();if(!name||!baseline||!change){$('#new-trial-error').textContent='Add a name, usual practice and one change.';return}const t={id:'trial-'+Date.now(),name,field:$('#new-trial-field').value,question:name,baseline,change,area:.2,budget:100,status:'draft',observations:[],methodKey:'trial'};state.community.trials.unshift(t);persist();trialFilter='All';go('trials');openTrial(t.id);break;}
case 'plan-save':savePlan(id);break;
case 'start-tracking':if($('#plan-question')&&!savePlan(id))return;showDialog('Approve observation tracking',`<p class="detail-summary">Start a private record for ${esc(trialById(id).name)}.</p><div class="inline-warning">This does not approve the agronomic design, schedule field work, or change the crop plan. Review the physical trial separately.</div>`,`<button class="btn secondary" data-action="open-trial" data-id="${id}">Back</button><button class="btn primary" data-action="confirm-tracking" data-id="${id}">Approve tracking</button>`);break;
case 'confirm-tracking':updateTrial(id,{status:'active'});persist();render();openTrial(id);toast('Observation tracking enabled. No field work scheduled.');break;
case 'record':recordObservation(id);break;
case 'attach-photo':$('#obs-photo').click();break;
case 'save-record':{const t=trialById(id),text=$('#obs-text').value.trim();if(!text){$('#obs-v2-error').textContent='Write an observation before saving.';return}t.observations.push({text,kind:$('#obs-kind').value,value:$('#obs-value').value.trim(),unit:$('#obs-unit').value.trim(),photo:observationPhoto||null,date:new Date().toLocaleDateString('en-CA')});persist();render();openTrial(id);toast('Observation saved privately.');break;}
case 'share-choose':chooseShare();break;
case 'share-trial':startShare(id);break;
case 'share-note':startShare(null);break;
case 'preview-share':previewShare();break;
case 'save-share-draft':if(!collectShare())return;state.community.shareDraft={...shareWorking};persist();closeDialog();toast('Saved privately. Nothing added to the feed.');break;
case 'edit-share':shareForm();break;
case 'publish-share':publishShare();break;
case 'unshare-post':showDialog('Remove shared post?',`<p class="detail-summary">Remove this summary from the demo feed and profile. Your private experiment and observations will stay intact.</p>`,`<button class="btn secondary" data-action="close">Keep post</button><button class="btn primary" data-action="confirm-unshare" data-id="${id}">Remove post</button>`);break;
case 'confirm-unshare':state.community.posts=state.community.posts.filter(p=>p.id!==id);state.community.saved=state.community.saved.filter(x=>x!==id);persist();closeDialog();preserveScrollRender();toast('Shared post removed. Private trial kept.');break;
}}
function updateCommunitySearch(q){const query=q.toLowerCase().trim();const found=allPosts().filter(p=>`${p.title} ${p.method||''} ${p.topic||''} ${p.author?person(p.author)?.name:''}`.toLowerCase().includes(query));$('#feed-search-results').innerHTML=found.map(p=>`<button class="action-tile" style="margin:10px 0" data-action="open-post" data-id="${p.id}"><span class="tag-icon ${p.type==='product'?'neutral':'clay'}">${icon(p.type==='product'?'product':'flask')}</span><span class="grow"><strong>${esc(p.title)}</strong><p>${p.type==='product'?'Product concept':esc(p.method||'Shared note')}</p></span>${icon('chevron')}</button>`).join('')||'<p class="small muted">No matching posts.</p>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)runSocialAction(b)});
document.addEventListener('input',e=>{if(e.target.id==='community-search')updateCommunitySearch(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='adapt-field')$('#adapt-area').max=fieldArea(e.target.value);if(e.target.name==='share-audience'){const v=e.target.value;$('#circle-select-wrap').classList.toggle('hide',v!=='circle');$('#share-preview-button').disabled=v==='private';}if(e.target.id==='obs-photo'){const f=e.target.files?.[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>8*1024*1024){$('#photo-preview').textContent='Choose a JPEG, PNG or WebP smaller than 8 MB.';return}const objectURL=URL.createObjectURL(f),img=new Image();img.onload=()=>{const scale=Math.min(1,900/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);observationPhoto=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(objectURL);const target=$('#photo-preview');if(target)target.innerHTML=`<img src="${observationPhoto}" alt="Local field photo preview"><p class="tiny muted">Resized locally. No upload.</p>`;};img.onerror=()=>{URL.revokeObjectURL(objectURL);const target=$('#photo-preview');if(target)target.textContent='Could not read this photo.';};img.src=objectURL;}});
ensureSocial();

hydrate();render();
</script>
</body>
</html>
