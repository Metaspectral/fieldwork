 {id:'seed',name:'Seed cost check',cat:'Costs',kind:'Calculation',icon:'seed',color:'gold',version:'1.0',desc:'Compare seed quotes using the numbers you already keep.',lede:'Same plan. A clearer view of the cost.',question:'“Is the other quote actually cheaper for my field?”',benefit:'Start with a price and sowing quantity. Compare purchase costs before deciding whether a change deserves a field trial.',inputs:['Seed price per bag','Bags per hectare','Area to compare'],steps:['Choose the quotes you want to compare.','Keep sowing quantity explicit and editable.','Calculate purchase cost per hectare and in total.','Show the difference; leave the decision to you.'],limits:'A cheaper quote is not proof of equivalent seed quality, yield or performance. This tool does not recommend a sowing rate.',evidence:'Your invoices and quotes are the primary evidence. The sample result is simple arithmetic, not a yield forecast.',source:null,permission:'Read only the quote values you select. Create a separate cost comparison. Never modify your original spreadsheet.',use:'For a grower already comparing quotes in Excel.'},

function getPlugin(id){return allPlugins().find(x=>x.id===id)}
function activeCount(){return Object.values(state.enabled).filter(Boolean).length}
function sourceLink(key){const s=SOURCE[key];return `<a class="evidence-link" href="${s.url}" target="_blank" rel="noopener noreferrer">${icon('book')}<span><strong>${s.name}</strong><p>${s.note}</p></span>${icon('external')}</a>`}

function rail(){return `<aside class="context-rail" aria-label="Farm context"><div class="between"><span class="eyebrow">Your workspace</span><span class="pill outline">Sample</span></div><div class="rail-block"><div class="row">${icon('farm')}<div><h3 style="margin:0">Alder Creek</h3><span class="tiny muted">3 fields · 12 ha · mixed crops</span></div></div></div><div class="rail-block"><div class="between"><h3>Working with</h3><button data-action="tools" class="tiny" style="color:var(--accent)">Manage</button></div>${allPlugins().filter(p=>state.enabled[p.id]).map(p=>`<button class="rail-item" style="width:100%;text-align:left" data-action="detail" data-id="${p.id}">${icon(p.icon)}<span class="grow"><strong>${esc(p.name)}</strong><p>Approved · v${esc(state.versions[p.id]||p.version)}</p></span>${icon('lock','small-icon')}</button>`).join('')}</div><div class="rail-block"><div class="eyebrow">What you've told us</div><p class="rail-note">“${esc(state.notes[0]?.text||'Start with what already works.')}”</p><div class="rail-note-caption">${esc(state.notes[0]?.source||'Your preference')} · editable</div><button class="btn ghost tiny" data-action="nav" data-page="farm" style="font-size:11px">See farm context ${icon('arrow','small-icon')}</button></div>${state.proposals.length?`<div class="review-teaser"><div class="row">${icon('inbox','small-icon')}<span class="eyebrow" style="color:var(--accent)">Your approval needed</span></div><h3>${state.proposals.length} proposed workflow update${state.proposals.length>1?'s':''}</h3><p>Nothing changes until you review it.</p><button class="btn ghost" data-action="review" style="font-size:11px;min-height:30px">Review changes ${icon('arrow','small-icon')}</button></div>`:''}<p class="tiny muted" style="margin-top:25px">Farm details and outcomes are illustrative. This prototype does not run an AI model.</p></aside>`}
function assistantPage(){const has=state.messages.length;return `<div class="assistant-layout"><section class="assistant-main">${!has?`<div class="assistant-intro"><div class="eyebrow">Your farm. Your way.</div><h1>A little help.<br><em>On your terms.</em></h1><p>Start with what works. Add the tools you need.<br>Learn something useful, one small step at a time.</p></div><div class="farm-context-bar"><button class="context-chip" data-action="nav" data-page="farm">${icon('farm','small-icon')} Alder Creek <span class="tiny" style="opacity:.65">· sample</span></button><button class="context-chip" data-action="tools">${icon('plugins','small-icon')} ${activeCount()} plug-ins on</button><button class="context-chip" data-action="preferences">${icon('settings','small-icon')} ${paceLabel()}</button></div><div class="agent-message"><div class="agent-label"><span class="assistant-symbol">${icon('spark')}</span> Fieldwork</div><p>What’s one thing you’d like to understand or improve next season?</p><div class="prompt-options"><button class="prompt-option" data-action="prompt" data-prompt="Can I lower my seed costs without changing the whole plan?">Lower seed costs ${'↗'}</button><button class="prompt-option" data-action="prompt" data-prompt="Help me explore a small rotation trial.">Try a rotation idea ↗</button><button class="prompt-option" data-action="import">Use my spreadsheet ↗</button></div>${recommendation()}</div><div class="file-teaser">${icon('sheet')}<div><strong>Already have a system?</strong><p>Keep your spreadsheet. Bring a read-only copy.</p></div><button class="icon-btn" data-action="import" aria-label="Import an existing spreadsheet">${icon('arrow')}</button></div>`:`<div class="conversation-heading"><div><div class="eyebrow">Alder Creek · demo conversation</div><h2 style="margin-top:7px">Let’s work through it.</h2></div><button class="icon-btn" data-action="new-chat" aria-label="New conversation">${icon('edit')}</button></div><div id="messages">${state.messages.map(messageHTML).join('')}</div>`}</section>${rail()}</div>`}
function messageHTML(m){if(m.role==='user')return `<div class="user-bubble">${esc(m.text)}</div>`;if(m.role==='typing')return `<div class="agent-message"><div class="agent-label"><span class="assistant-symbol">${icon('spark')}</span> Fieldwork</div><div class="typing"><i></i><i></i><i></i><span style="margin-left:6px">Preparing a demo response</span></div></div>`;return `<div class="agent-message"><div class="agent-label"><span class="assistant-symbol">${icon('spark')}</span> Fieldwork <span class="time">Scripted example</span></div><div class="trace"><span class="dot"></span> ${esc(m.trace||'Your context stays in your control')}</div><p>${esc(m.text)}</p>${m.kind==='plugin'?pluginResponse(m.id):m.kind==='custom'?customResponse(m.prompt):m.kind==='import'?`<div class="tool-card"><div class="row">${tag(getPlugin('sheet'))}<h3>Use what you already have</h3></div><p>Preview a CSV export from Excel or Sheets. You choose the columns, and the original stays unchanged.</p><button class="btn secondary" data-action="import">${icon('sheet','small-icon')} Choose a CSV</button></div>`:m.kind==='update'?`<div class="tool-card"><span class="pill accent">Proposal, not a change</span><h3 style="margin-top:12px">Review the workflow before it changes</h3><p>Keep the approved version running, inspect the difference, then accept or decline. You can also roll back an accepted update.</p><button class="btn secondary" data-action="review">Review changes ${icon('arrow','small-icon')}</button></div>`:m.kind==='note'?`<div class="tool-card"><h3>A note worth keeping?</h3><p>Save it as something you reported, not a measured fact. You can edit or remove it later.</p><button class="btn secondary" data-action="note" data-text="${esc(m.prompt||'')}">Review a farm note ${icon('arrow','small-icon')}</button></div>`:`<div class="followups"><button class="prompt-option" data-action="nav" data-page="plugins">Explore plug-ins ↗</button><button class="prompt-option" data-action="custom">Make my own ↗</button><button class="prompt-option" data-action="import">Bring my records ↗</button></div>`}</div>`}
function pluginResponse(id){const p=getPlugin(id);return `<div class="tool-card"><div class="between"><div class="row">${tag(p)}<div><h3>${esc(p.name)}</h3><span class="tiny muted">${p.kind} · v${p.version}</span></div></div><span class="pill accent">Suggested</span></div><p>${esc(p.desc)} Nothing will be activated or changed unless you approve it.</p><div class="flow-chips"><span>${p.inputs.length} inputs</span><span>Inspectable method</span><span>You decide</span></div><div class="buttons"><button class="btn primary" data-action="detail" data-id="${p.id}">Explore this plug-in ${icon('arrow','small-icon')}</button><button class="btn secondary" data-action="sandbox" data-id="${p.id}">Try sample</button></div></div>`}
function customResponse(prompt){return `<div class="tool-card"><div class="row"><span class="tag-icon purple">${icon('branch')}</span><div><span class="pill accent">Draft first</span><h3 style="margin-top:5px">Your own approach, as a plug-in</h3></div></div><p>Give it a name, define the routine and choose its inputs. In this prototype, that becomes an editable template—not generated executable code.</p><button class="btn primary" data-action="custom" data-text="${esc(prompt||'')}">Draft my plug-in ${icon('arrow','small-icon')}</button></div>`}
function paceLabel(){return({small:'Small steps',balanced:'A few options',explore:'Explore widely'})[state.prefs.pace]||'Small steps'}
function pluginsPage(){return `<section class="page"><div class="page-header"><div class="between"><div><div class="eyebrow">Your methods. Your sources. Your choice.</div><h1>Make it work <span class="serif italic" style="color:var(--accent)">your way.</span></h1></div><button class="icon-btn" data-action="custom" aria-label="Create a custom plug-in">${icon('plus')}</button></div><p>Start with a plug-in. See how it works. Try it, adapt it, or leave it for later.</p></div><div class="library-tabs" role="tablist" aria-label="Plug-in collection"><button role="tab" aria-selected="${libraryTab==='discover'}" class="${libraryTab==='discover'?'active':''}" data-action="library-tab" data-tab="discover">Discover</button><button role="tab" aria-selected="${libraryTab==='mine'}" class="${libraryTab==='mine'?'active':''}" data-action="library-tab" data-tab="mine">My plug-ins <span class="count">${Object.keys(state.installed).filter(k=>state.installed[k]).length+state.custom.filter(x=>!state.installed[x.id]).length}</span></button></div>${libraryTab==='discover'?`<div class="library-hero"><div><div class="eyebrow" style="color:var(--wash-ink);margin-bottom:8px">Built to be made your own</div><h2>Good starting points.<br>Not someone else’s rulebook.</h2><p>Your experience stays the foundation. Add sources and methods when they’re useful to you.</p></div>${pluginArt()}</div>`:`<div class="info-box">${icon('lock','small-icon')}<span>Approved versions stay put. Agent suggestions become drafts; updates wait for your review.</span></div>`}<div class="searchbar">${icon('search','small-icon')}<label class="sr-only" for="plugin-search">Search plug-ins</label><input id="plugin-search" placeholder="Find a tool, method, or data source…" value="${esc(search)}"></div><div class="filters" aria-label="Filter plug-ins">${['All','Costs','Weather','Imagery','Methods','Records'].map(c=>`<button class="${category===c?'active':''}" data-action="filter" data-filter="${c}" aria-pressed="${category===c}">${c}</button>`).join('')}</div><div id="plugin-list">${pluginList()}</div><div class="custom-callout"><div><h3>Your way of doing things belongs here, too.</h3><p>Turn a routine or an idea into your own reusable plug-in.</p></div><button class="icon-btn" data-action="custom" aria-label="Draft your own plug-in">${icon('plus')}</button></div><div class="library-footer">${icon('info','small-icon')}<span>These are concept templates, not endorsed integrations. Public references explain the approach; no live services are connected.</span></div></section>`}
function pluginList(){const list=allPlugins().filter(p=>(libraryTab!=='mine'||state.installed[p.id]||p.custom)&&(category==='All'||p.cat===category)&&(!search||`${p.name} ${p.desc} ${p.kind}`.toLowerCase().includes(search.toLowerCase())));return list.length?`<div class="plugin-grid">${list.map(pluginCard).join('')}</div>`:`<div class="empty-state">${icon('search')}<h3>No plug-ins in this view.</h3><p>Try another filter or create a starting point of your own.</p><button class="btn ghost" data-action="clear-filters">Clear filters</button></div>`}
function pluginCard(p){const installed=state.installed[p.id],on=state.enabled[p.id];return `<article class="plugin-card"><div class="between">${tag(p)}<span class="plugin-kind">${esc(p.kind)}</span></div><div class="card-title"><button data-action="detail" data-id="${p.id}" style="text-align:left;padding:0"><h3>${esc(p.name)}</h3></button></div><p class="desc">${esc(p.desc)}</p><div class="plugin-card-footer"><span class="meta">${installed?`<span class="row" style="gap:6px"><span class="dot" style="color:${on?'var(--accent)':'var(--faint)'}"></span>${on?'On':'Paused'} · v${esc(state.versions[p.id]||p.version)}</span>`:p.custom?'Your draft · not enabled':`${p.source?'Public reference':'Your records'} · optional`}</span><button data-action="detail" data-id="${p.id}">${installed?'Manage':'Explore'} ${icon('arrow','small-icon')}</button></div></article>`}
function trialsPage(){const t=state.trial;return `<section class="page narrow"><div class="page-header"><div class="eyebrow">Keep the baseline. Learn from the difference.</div><h1>One thing <span class="serif italic" style="color:var(--accent)">at a time.</span></h1><p>Try a tool with sample data, or plan a real-world comparison. They’re not the same thing.</p></div><div class="two-col"><div><div class="section-head between"><h2>Field trials</h2><span class="pill outline">Sample farm</span></div><article class="trial-card"><div class="trial-header"><div class="between"><span class="pill ${t.status==='draft'?'accent':'blue'}">${icon(t.status==='draft'?'edit':'check','small-icon')} ${t.status==='draft'?'Plan draft':'Tracking approved'}</span><span class="tiny muted">${esc(t.field)}</span></div><h2>${esc(t.name)}</h2><p>${esc(t.question)}</p></div><div class="trial-metrics"><div><strong>${esc(t.area)} ha</strong><span>Maximum trial area</span></div><div><strong>$${esc(t.budget)}</strong><span>Spending limit · CAD</span></div><div><strong>${t.observations.length}</strong><span>Recorded observations</span></div></div><div class="trial-footer"><span class="tiny muted">${t.status==='draft'?'Design review still needed':'Track actual work, not just the plan'}</span><button class="btn secondary" data-action="trial-detail">${t.status==='draft'?'Review plan':'Open trial'} ${icon('arrow','small-icon')}</button></div><div class="trial-progress"><span class="done"></span><span class="${t.status==='active'?'done':''}"></span><span></span><span></span></div></article><button class="btn secondary wide" data-action="detail" data-id="trial">${icon('flask','small-icon')} Explore a trial starting point</button></div><div><div class="section-head"><h2>Try without changing anything</h2></div><div class="card card-pad"><div class="row">${tag(getPlugin('seed'))}<div><h3>Seed cost sandbox</h3><span class="tiny muted">Illustrative quotes · no farm changes</span></div></div><p class="small muted" style="margin:14px 0 19px">Change the example prices and see how the calculation behaves before adding the tool to your farm.</p><button class="btn primary wide" data-action="sandbox" data-id="seed">Open sandbox ${icon('arrow','small-icon')}</button></div><div class="learning-note"><h3>“No change” can be a good result.</h3><p>A useful trial can confirm what already works. Not enough evidence? Keep it inconclusive, not automatically unsuccessful.</p></div><div class="card card-pad"><div class="row">${icon('book','small-icon')}<h3 style="font-size:13px">Your learning record</h3></div><p class="small muted" style="margin-top:10px">No measured results yet. Your notes and trial outcomes will stay distinct from assumptions and other people’s findings.</p><button class="btn ghost" data-action="observation" style="font-size:12px">Record an observation ${icon('plus','small-icon')}</button></div></div></div></section>`}
function farmPage(){return `<section class="page narrow"><div class="page-header"><div class="eyebrow">Alder Creek · illustrative farm</div><h1>Your farm’s <span class="serif italic" style="color:var(--accent)">working memory.</span></h1><p>Keep what you know. Bring what you have. Add detail only when it helps.</p></div><div class="two-col"><div class="stack"><div class="card card-pad"><div class="between"><h3>Places we’re working with</h3><span class="pill outline">Schematic</span></div>${fieldMap()}<div class="field-list"><span>North field</span><strong>4 ha</strong></div><div class="field-list"><span>River field</span><strong>6 ha</strong></div><div class="field-list"><span>Home field</span><strong>2 ha</strong></div><p class="tiny muted" style="margin-top:12px">Example boundaries, not real geospatial data.</p></div><div class="card card-pad"><div class="between"><h3>What you’ve told us</h3><button class="icon-btn" data-action="note" aria-label="Add farm knowledge">${icon('plus')}</button></div><div class="notes-list">${state.notes.map((n,i)=>`<div class="note"><p>“${esc(n.text)}”</p><div class="between"><span class="pill outline">${esc(n.field)}</span><button class="icon-btn" data-action="edit-note" data-index="${i}" aria-label="Edit note" style="height:26px;width:26px">${icon('edit','small-icon')}</button></div><div class="tiny muted" style="margin-top:6px">${esc(n.source)} · not independently verified</div></div>`).join('')}</div></div></div><div class="stack"><div class="card card-pad"><div class="between"><h3>Your existing records</h3><span class="pill blue">Read-only</span></div>${state.sources.map((s,i)=>`<div class="source-row">${icon('sheet')}<div class="grow"><strong style="overflow-wrap:anywhere">${esc(s.name)}</strong><p>${s.rows.length} rows · ${s.headers.length} columns · ${s.kind==='sample'?'included example':'local import'}</p></div><button class="icon-btn" data-action="source-preview" data-index="${i}" aria-label="Preview ${esc(s.name)}">${icon('chevron','small-icon')}</button></div>`).join('')}<button class="btn secondary wide" data-action="import" style="margin-top:14px">${icon('plus','small-icon')} Bring a CSV from Excel or Sheets</button><p class="tiny muted" style="margin-top:12px">No account connection. Your original file is never changed.</p></div><div class="card card-pad"><div class="between"><h3>Your comfort with change</h3>${icon('settings','small-icon')}</div><div class="segmented" aria-label="Exploration preference">${[['small','Small steps'],['balanced','A few options'],['explore','Explore widely']].map(([v,l])=>`<button data-action="pace" data-value="${v}" class="${state.prefs.pace===v?'active':''}" aria-pressed="${state.prefs.pace===v}">${l}</button>`).join('')}</div><p class="settings-help">${paceHelp()}</p><div class="rule"></div><div class="control-row"><div><h3>Ask before making changes</h3><p>Activations, new records and workflow updates need your approval.</p></div>${icon('lock','small-icon')}</div><div class="control-row"><div><h3>Private by default</h3><p>No external sharing or background connections in this prototype.</p></div>${icon('shield','small-icon')}</div></div><div class="card card-pad"><h3>Always yours to take with you</h3><p class="small muted" style="margin:9px 0 15px">Export your workspace as JSON, including notes, approved workflows and imported columns.</p><div class="row wrap"><button class="btn secondary" data-action="export">${icon('download','small-icon')} Export workspace</button><button class="btn ghost" data-action="reset" style="font-size:11px">Reset demo</button></div><p class="tiny muted" style="margin-top:11px">${storageAvailable?'Saved only in this browser.':'Browser storage is unavailable; changes last only for this session.'}</p></div></div></div></section>`}
function paceHelp(){return({small:'Keep familiar practices as the default. Show one manageable idea at a time.',balanced:'Compare a small number of options and make their trade-offs explicit.',explore:'Show a wider set of ideas, including early-stage methods. More options never means automatic adoption.'})[state.prefs.pace]}
function showDialog(title,body,footer='',headIcon=null,subtitle=''){const d=$('#sheet');if(!d.open)dialogOrigin=document.activeElement;d.setAttribute('aria-label',title);d.innerHTML=`<div class="dialog-shell"><div class="sheet-head">${headIcon?tag(headIcon,true):''}<div class="grow">${subtitle?`<div class="eyebrow">${esc(subtitle)}</div>`:''}<h2>${esc(title)}</h2></div><button class="icon-btn close" data-action="close" aria-label="Close panel">${icon('x')}</button></div><div class="sheet-scroll">${body}</div>${footer?`<div class="sheet-footer">${footer}</div>`:''}</div>`;if(!d.open)d.showModal();d.querySelector('.sheet-scroll').scrollTop=0;hydrate(d)}
function closeDialog(){const d=$('#sheet');if(d.open)d.close()}
function detail(id){const p=getPlugin(id);if(!p)return;const installed=!!state.installed[id],on=!!state.enabled[id],override=state.overrides[id];const version=state.versions[id]||p.version;const history=state.history[id]||[];const body=`<p class="detail-lede">${esc(p.lede)}</p><p class="detail-copy">${esc(p.benefit)}</p><div class="info-box clay">${icon('chat','small-icon')}<div><strong>${esc(p.question)}</strong><br>${esc(p.use)}</div></div><div class="detail-section"><h3>What it needs from you</h3><div class="flow-chips">${p.inputs.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div><div class="detail-section"><div class="between"><h3>A stable, inspectable workflow</h3><span class="pill outline">v${esc(version)}</span></div>${p.steps.map((s,i)=>`<div class="mini-step"><span class="step-num">${i+1}</span><span>${esc(s)}</span></div>`).join('')}${override?`<div class="saved-notice">${icon('check','small-icon')}<div><strong>Your approved adaptation</strong><p style="margin-top:4px">${esc(override)}</p></div></div>`:''}</div><div class="detail-section"><h3>Evidence & where it stops</h3><p class="detail-copy">${esc(p.evidence)}</p>${p.source?sourceLink(p.source):`<div class="evidence-link">${icon('file')}<span><strong>${id==='sheet'?'Your selected CSV':'Farmer-provided records'}</strong><p>Only the information you choose to add. No implied independent verification.</p></span></div>`}<div class="info-box">${icon('info','small-icon')}<span>${esc(p.limits)}</span></div></div><div class="detail-section"><h3>You stay in control</h3><div class="permission">${icon('shield')}<div><strong>Limited access, visible output</strong><p>${esc(p.permission)}</p></div></div><div class="permission">${icon('lock')}<div><strong>No silent updates</strong><p>The approved version is pinned. Proposed changes wait for your review.</p></div></div></div><div class="version-bar"><span>${p.custom?'Your custom template':'Fieldwork concept starter'} · <code>v${esc(version)}</code></span><button data-action="${installed?'propose-edit':'customize'}" data-id="${id}" style="color:var(--accent)">${installed?'Propose an update':'Make it mine'}</button></div>${history.length?`<button class="btn ghost" data-action="rollback" data-id="${id}" style="font-size:11px">${icon('undo','small-icon')} Review rollback to v${esc(history[history.length-1].version)}</button>`:''}${installed?`<div class="control-row"><div><h3>${on?'Enabled for this workspace':'Paused for this workspace'}</h3><p>${on?'Pause without deleting your configuration.':'Your saved settings will be kept.'}</p></div><button class="install-toggle ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="Enable ${esc(p.name)}" data-action="toggle" data-id="${id}"></button></div>`:''}`;
 showDialog(p.name,body,`<button class="btn secondary" data-action="sandbox" data-id="${id}">${icon('flask','small-icon')} Try sample</button><button class="btn primary" data-action="${installed?'customize':'activate'}" data-id="${id}">${installed?'Make my own copy':'Add to my farm'} ${icon('arrow','small-icon')}</button><span class="footer-note">Trying sample data does not activate the plug-in.</span>`,p,`${p.kind} · ${p.cat} · concept`)}

function calculateSeed(){if(!$('#price-a'))return;const vals=['price-a','price-b','bags','area'].map(id=>Number($('#'+id).value));const valid=vals.every(Number.isFinite)&&vals[0]>=0&&vals[1]>=0&&vals[2]>0&&vals[3]>0&&['price-a','price-b','bags','area'].every(id=>$('#'+id).value!==''&&$('#'+id).checkValidity());if(!valid){$('#calculation').innerHTML='<p class="error-message">Enter valid non-negative prices and a positive quantity and area.</p>';return}const [a,b,q,area]=vals;const diff=(a-b)*q;$('#calculation').innerHTML=`<div class="sandbox-grid"><div class="metric-box"><span class="eyebrow">Current quote</span><div class="number">${money(a*q)}</div><span class="tiny muted">Per hectare · same quantity</span></div><div class="metric-box"><span class="eyebrow">Other quote</span><div class="number accent">${money(b*q)}</div><span class="tiny muted">Per hectare · same quantity</span></div></div><div class="saved-notice">${icon('wallet','small-icon')}<div><strong>${money(Math.abs(diff*area))} ${diff>=0?'less':'more'} across ${area} ha</strong><br><span class="tiny">${money(Math.abs(diff))} ${diff>=0?'less':'more'} per hectare in seed purchase cost only.</span></div></div>`}
function weatherResult(){const n=Number($('#rain-threshold').value);$('#weather-result').textContent=`${n} mm/day limit → ${[['Monday',8],['Tuesday',5],['Wednesday',2],['Thursday',0],['Friday',3]].filter(x=>x[1]<=n).map(x=>x[0]).join(', ')} meet this example threshold.`;document.querySelectorAll('.weather-day').forEach((el,i)=>el.classList.toggle('selected',[8,5,2,0,3][i]<=n))}
function customize(id=null,text='',mode='copy'){const p=id?getPlugin(id):null;const updating=mode==='update';showDialog(updating?'Propose a workflow update':'Make it your own',`<span class="pill ${updating?'accent':'blue'}">${updating?'Draft update · current version stays active':p?'A separate copy · original unchanged':'Your method · draft template'}</span><p class="detail-copy" style="margin-top:15px">${updating?'Describe what should change. Review the difference before approving a new version.':'Start with your way of working. The agent can help shape the routine; you decide what it is allowed to do.'}</p><div class="form-field"><label for="custom-name">Name this approach</label><input id="custom-name" maxlength="70" value="${esc(updating?p.name:p?'My '+p.name.toLowerCase():'My wet-field check')}" ${updating?'readonly':''}></div><div class="form-field"><label for="custom-instructions">What should it do? What should it never do?</label><textarea id="custom-instructions" maxlength="1600" rows="5">${esc(text||(p?(state.overrides[id]||p.steps.join('\n')):'Before suggesting a sowing window, check my note about the north field staying wet. Ask me to confirm conditions first. Never move a task automatically.'))}</textarea><small>This creates a reusable instruction template, not generated executable code.</small></div><div class="detail-section"><h3>Keep these boundaries</h3><div class="permission">${icon('lock')}<div><strong>Selected records only</strong><p>${p?esc(p.permission):'Use confirmed farm notes. Ask separately before using another data source.'}</p></div></div><div class="permission">${icon('shield')}<div><strong>Suggestions, not autonomous changes</strong><p>Nothing activates, connects or updates until you approve it.</p></div></div></div><div id="custom-error" class="error-message" role="alert"></div>`,`<button class="btn secondary" data-action="close">Cancel</button><button class="btn primary" data-action="save-custom" data-id="${id||''}" data-mode="${mode}">${updating?'Create update proposal':'Save draft'} ${icon('arrow','small-icon')}</button>`)}
function saveCustom(id,mode){const name=$('#custom-name').value.trim(),text=$('#custom-instructions').value.trim();if(!name||!text){$('#custom-error').textContent='Add a name and the routine you want to preserve.';return}if(mode==='update'){
 const p=getPlugin(id),old=state.versions[id]||p.version;const parts=old.split('.').map(Number),version=`${parts[0]||1}.${(parts[1]||0)+1}`;
 state.proposals=state.proposals.filter(x=>x.pluginId!==id);state.proposals.push({id:'proposal-'+Date.now(),pluginId:id,version,before:state.overrides[id]||p.steps.join('\n'),after:text,permission:p.permission,source:'Your proposed adaptation'});persist();render();review();return;}
 const p=id?getPlugin(id):null;const newId='custom-'+Date.now();const custom={id:newId,name,cat:p?.cat||'Methods',kind:'Your method',icon:p?.icon||'branch',color:p?.color||'purple',version:'0.1',custom:true,desc:'Your own reusable approach. Review it before enabling.',lede:'An approach that fits the way you work.',question:'“Can we do this my way?”',benefit:text,inputs:p?.inputs||['Confirmed farm notes','Your approval of any additional input'],steps:text.split('\n').map(s=>s.trim()).filter(Boolean),limits:'Custom instruction template only. It has not been evaluated for agronomic or statistical validity and does not execute code in this prototype.',evidence:p?.evidence||'Your stated routine is the starting point. It is not independent evidence of effectiveness.',source:p?.source||null,permission:p?.permission||'Read confirmed farm notes. Produce suggestions only. Ask before using new data or changing a record.',use:'Adapted by you for this workspace.',basedOn:id};state.custom.push(custom);persist();render();detail(newId);toast('Draft saved. It is not enabled.');}
function review(){if(!state.proposals.length){showDialog('Changes & approvals',`<div class="empty-state">${icon('check')}<h3>Nothing waiting on you.</h3><p>Your approved plug-in versions are unchanged. Propose an edit from any plug-in’s detail view.</p></div>`,`<button class="btn primary" data-action="close">Done</button>`);return}showDialog('Changes & approvals',`<p class="detail-copy">The agent can suggest improvements. Only you can make them part of the way your farm works.</p><div class="review-list" style="margin-top:20px">${state.proposals.map(r=>{const p=getPlugin(r.pluginId);return `<div class="review-card"><div class="row">${tag(p)}<div><h3>${esc(p.name)}</h3><span class="tiny muted">v${esc(state.versions[p.id]||p.version)} → v${esc(r.version)}</span></div></div><p>${esc(r.after)}</p><span class="pill accent">Waiting for your approval</span><button class="btn secondary wide" style="margin-top:15px" data-action="review-proposal" data-id="${r.id}">Inspect the change ${icon('arrow','small-icon')}</button></div>`}).join('')}</div>`,`<button class="btn secondary" data-action="close">Keep current versions</button>`)}
function reviewProposal(id){const r=state.proposals.find(x=>x.id===id);if(!r)return;const p=getPlugin(r.pluginId);showDialog('Review the difference',`<div class="row">${tag(p)}<div><h3>${esc(p.name)}</h3><span class="tiny muted">${esc(r.source)}</span></div></div><div class="diff"><div class="diff-title">v${esc(state.versions[p.id]||p.version)} → v${esc(r.version)}</div><div class="diff-row"><div class="eyebrow">Current, approved behaviour</div><div style="white-space:pre-wrap">${esc(r.before)}</div></div><div class="diff-row added"><div class="eyebrow">Proposed behaviour</div><div style="white-space:pre-wrap">${esc(r.after)}</div></div></div><div class="permission">${icon('shield')}<div><strong>Access & approval</strong><p>${esc(r.permission)}</p></div></div><div class="info-box">${icon('undo','small-icon')}<span>Approving preserves the previous version so you can roll back. Declining leaves the current workflow untouched.</span></div>`,`<button class="btn secondary" data-action="reject-update" data-id="${id}">Decline update</button><button class="btn primary" data-action="approve-update" data-id="${id}">Approve v${esc(r.version)}</button>`,null,'Your workflow, your decision')}
function applyUpdate(id){const r=state.proposals.find(x=>x.id===id);if(!r)return;const p=getPlugin(r.pluginId);if(!state.history[p.id])state.history[p.id]=[];state.history[p.id].push({version:state.versions[p.id]||p.version,override:state.overrides[p.id]||null});state.versions[p.id]=r.version;state.overrides[p.id]=r.after;state.proposals=state.proposals.filter(x=>x.id!==id);persist();render();detail(p.id);toast('Update approved. Previous version retained.')}

function openImport(){pendingImport=null;showDialog('Bring your existing records',`<p class="detail-lede">Keep the spreadsheet.<br>Skip starting over.</p><p class="detail-copy">Choose a CSV export from Excel or Google Sheets. Preview the data, select columns and approve a read-only copy.</p><div class="dropzone">${icon('upload')}<h3>A CSV from your device</h3><p>Up to 500 KB and 500 rows in this prototype.</p><button class="btn secondary" data-action="choose-file">Choose CSV file</button></div><div class="between wrap"><button class="btn ghost" data-action="sample-import" style="font-size:12px">Use the example crop sheet ${icon('arrow','small-icon')}</button><button class="btn ghost" data-action="csv-template" style="font-size:11px">${icon('download','small-icon')} Get example CSV</button></div><div id="import-content"></div><div class="info-box">${icon('lock','small-icon')}<span>Files are read locally. Only the columns you approve are saved in this browser. No cloud accounts, uploads or write-back.</span></div>`,`<button class="btn secondary" data-action="close">Cancel</button><button class="btn primary" id="confirm-import" data-action="confirm-import" disabled>Use selected columns</button><span class="footer-note">Use sample or non-sensitive data on a shared device.</span>`)}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(x=>x.trim()))rows.push(row);row=[];value=''}else value+=c}if(quoted)throw Error('The CSV has an unclosed quoted value. Export the file again and retry.');row.push(value);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw Error('Include a header row and at least one data row.');const headers=rows.shift().map(x=>x.trim());if(headers.length>30)throw Error('This prototype supports up to 30 columns.');if(headers.some(x=>!x)||new Set(headers).size!==headers.length)throw Error('Please use a unique, non-empty name for every column.');if(rows.length>500)throw Error('This prototype supports up to 500 data rows.');if(rows.some(r=>r.length!==headers.length))throw Error('Some rows have a different number of columns. Check the CSV format.');return{headers,rows}}
function previewImport(name,text,kind='local'){try{const data=parseCSV(text);pendingImport={name,kind,...data};$('#import-content').innerHTML=`<div class="import-preview"><div class="between"><h3 style="font-size:13px;overflow-wrap:anywhere">${esc(name)}</h3><span class="pill outline">${data.rows.length} rows</span></div><p class="tiny muted" style="margin-top:9px">Choose the columns this workspace may use.</p><div class="row wrap" style="gap:0 14px;margin-top:6px">${data.headers.map((h,i)=>`<label class="check-line"><input type="checkbox" class="import-column" value="${i}" checked><span>${esc(h)}</span></label>`).join('')}</div>${table(data.headers,data.rows.slice(0,4))}<p class="tiny muted">Previewing ${Math.min(4,data.rows.length)} of ${data.rows.length} rows. ${kind==='sample'?'Included sample data.':'Only selected columns are retained.'}</p></div>`;$('#confirm-import').disabled=false}catch(e){pendingImport=null;$('#import-content').innerHTML=`<p class="error-message" role="alert">${esc(e.message)}</p>`;$('#confirm-import').disabled=true}}
